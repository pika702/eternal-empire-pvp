<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>永恒帝国：龙之纪元</title>
<style>
/* ============ 主题变量 ============ */
:root{ --bg:#0d0d12; --bg2:#15151f; --panel:#1b1b27; --panel2:#22222f;
  --gold:#d4af37; --gold2:#f0d77b; --red:#c0392b; --red2:#e85d4a; --ink:#e8e2d0; --muted:#9a917f;
  --line:#3a3320; --good:#5fbf7a; --bad:#e0604f; --bd:1px solid var(--line); }
body.theme-minghuang{ --gold:#d4af37; --gold2:#f5e08a; }
body.theme-zhuhong{ --bg:#160a0a; --bg2:#221011; --panel:#2a1414; --panel2:#341a1a; --gold:#e85d4a; --gold2:#ffb199; --red:#c0392b; --ink:#f3e2dd; --line:#5a2420; }
body.theme-molv{ --bg:#0c1410; --bg2:#11201a; --panel:#16271f; --panel2:#1d3329; --gold:#7fbf6a; --gold2:#bfe8a8; --red:#c0392b; --ink:#e2f0e6; --line:#2a4a38; }
body.theme-shuimo{ --bg:#16181a; --bg2:#1f2225; --panel:#26292d; --panel2:#2e3236; --gold:#9aa3a8; --gold2:#cfd6da; --red:#b05a52; --ink:#e6e9ec; --line:#3a3f44; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:"KaiTi","STKaiti","Songti SC","SimSun",serif;background:var(--bg);color:var(--ink);font-size:15px;overflow:hidden}
body{font-size:var(--fs,15px)}
#app{display:flex;flex-direction:column;height:100%}
/* 顶栏 */
#top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:linear-gradient(90deg,var(--bg2),var(--panel));border-bottom:2px solid var(--gold);box-shadow:0 2px 8px #0008}
#top .title{font-size:18px;color:var(--gold2);font-weight:bold;letter-spacing:2px;text-shadow:0 0 6px var(--gold)}
.stat{background:var(--panel2);border:var(--bd);border-radius:6px;padding:3px 9px;font-size:13px;white-space:nowrap}
.stat b{color:var(--gold2)}
.stat .bad{color:var(--bad)} .stat .good{color:var(--good)}
/* 行动点圆点：上限 15 点，缩小尺寸与间距并允许换行，避免撑破顶栏 */
#apdot{display:inline-flex;flex-wrap:wrap;gap:2px;row-gap:2px;max-width:132px;vertical-align:middle;justify-content:flex-start}
#apdot i{width:6px;height:6px;border-radius:50%;background:var(--red);display:inline-block}
#apdot i.on{background:var(--gold);box-shadow:0 0 4px var(--gold)}
/* 导航 */
#nav{display:flex;gap:4px;padding:6px 10px;background:var(--bg2);border-bottom:var(--bd);overflow-x:auto}
.tab{padding:6px 14px;border:var(--bd);border-radius:18px;cursor:pointer;white-space:nowrap;color:var(--muted);font-size:14px;transition:.15s}
.tab:hover{color:var(--gold2)}
.tab.active{background:var(--gold);color:#1a1206;font-weight:bold;border-color:var(--gold)}
/* 屏幕 */
#screen{flex:1;overflow:auto;padding:12px;position:relative}
.screen{display:none}
.screen.active{display:block}
.row{display:flex;flex-wrap:wrap;gap:10px}
.card3{background:var(--panel);border:var(--bd);border-radius:10px;padding:10px 12px;box-shadow:inset 0 0 18px #0005}
.card3 .h{color:var(--gold2);font-weight:bold;margin:0 0 8px;border-left:3px solid var(--gold);padding-left:8px}
.muted{color:var(--muted);font-size:12.5px;line-height:1.5}
.btn{background:linear-gradient(180deg,var(--panel2),var(--panel));color:var(--ink);border:var(--bd);border-radius:7px;padding:7px 12px;cursor:pointer;font-family:inherit;font-size:14px;transition:.12s;margin:3px 0}
.btn:hover{border-color:var(--gold);color:var(--gold2);box-shadow:0 0 8px #d4af3733}
.btn:active{transform:translateY(1px)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1206;border:none;font-weight:bold}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bar{display:inline-block;width:60px;height:8px;background:#0006;border-radius:4px;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
/* 卡牌 */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pcard{background:linear-gradient(160deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:10px;padding:8px;position:relative;cursor:pointer;transition:.15s;min-height:150px}
.pcard:hover{transform:translateY(-3px);box-shadow:0 6px 16px #0009}
.pcard .cn{font-weight:bold;color:var(--gold2);font-size:14px}
.pcard .ccat{position:absolute;top:6px;right:6px;font-size:11px;padding:1px 6px;border-radius:8px;background:#0007}
.pcard .cdesc{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.pcard .rare{font-size:12px;margin-top:4px}
.r-橙{border-color:#ff9d2e;box-shadow:0 0 10px #ff9d2e66}
.r-紫{border-color:#b06bff;box-shadow:0 0 8px #b06bff55}
.r-蓝{border-color:#4aa3ff;box-shadow:0 0 6px #4aa3ff44}
.r-绿{border-color:#5fbf7a}
.ct-政策{background:#3a5a8a} .ct-军事{background:#8a3a3a} .ct-人才{background:#3a8a5a} .ct-天命{background:#b08a2a} .ct-事件{background:#7a5a8a}
/* 沙盘 */
#mapwrap{position:relative;height:62vh;overflow:hidden;background:radial-gradient(circle at 50% 40%,#1a2a3a,#0a0f16);border:var(--bd);border-radius:10px}
#map{position:absolute;left:0;top:0;width:1600px;height:1100px;transform-origin:0 0;cursor:grab}
.node{position:absolute;transform:translate(-50%,-50%);min-width:54px;text-align:center;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:3px 5px;font-size:11px;cursor:pointer;user-select:none}
.node:hover{border-color:var(--gold)}
.node.sel{box-shadow:0 0 0 3px var(--gold);border-color:var(--gold)}
.node.from{box-shadow:0 0 0 3px var(--good);}
.node.to{box-shadow:0 0 0 3px var(--bad);}
.node .nt{color:var(--gold2);font-weight:bold}
.node .nd{color:var(--muted);font-size:10px}
.node.special{border-style:dashed;border-color:var(--gold2)}
#mapctrl{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:4px;z-index:5}
/* 后宫 */
.conc{background:var(--panel);border:var(--bd);border-radius:10px;padding:9px;width:200px}
.conc .cn{color:var(--gold2);font-weight:bold}
.six{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:12px;margin-top:4px}
.six span b{color:var(--gold2)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;background:#0007;margin:2px 2px 0 0;color:var(--gold2)}
/* 模态 */
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.show{display:flex}
#modalBox{background:var(--bg2);border:2px solid var(--gold);border-radius:12px;max-width:680px;width:100%;max-height:86vh;overflow:auto;padding:16px;box-shadow:0 0 40px #000}
#modalBox h3{margin:0 0 10px;color:var(--gold2);border-left:3px solid var(--gold);padding-left:8px}
/* 通知栏 */
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:90%;max-width:520px}
.toastmsg{background:linear-gradient(180deg,#2a2410,#1a160a);border:1px solid var(--gold);color:var(--gold2);padding:8px 16px;border-radius:8px;font-size:14px;white-space:pre-line;text-align:center;box-shadow:0 4px 16px #000a;animation:tin .25s ease;max-width:100%}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
/* 龙气特效 */
#dragon{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#dragon.on{display:block}
#dragon .p{border:2px solid var(--gold);border-radius:50%;position:absolute;opacity:.0;animation:drift 7s linear infinite}
@keyframes drift{0%{opacity:0;transform:translate(0,0) scale(.4)}50%{opacity:.5}100%{opacity:0;transform:translate(40px,-60px) scale(1.3)}}
/* 设置 */
.setrow{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:var(--bd)}
.setrow input[type=range]{width:140px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:5px 10px;border:var(--bd);background:var(--panel);color:var(--muted);border-radius:6px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--gold);color:#1a1206;font-weight:bold}
#gear{position:fixed;top:70px;right:10px;z-index:40;background:var(--gold);color:#1a1206;border:none;border-radius:50%;width:42px;height:42px;font-size:20px;cursor:pointer;box-shadow:0 2px 10px #000}
.stat b.neg{color:var(--bad);animation:negflash .9s steps(1) infinite;font-weight:bold}
@keyframes negflash{50%{opacity:.3}}
.banner-danger{background:#5a1414;color:#ffc2c2;padding:6px 10px;border-radius:6px;margin:6px 0;font-size:13px}
.banner-warn{background:#5a4a14;color:#ffe9a8;padding:6px 10px;border-radius:6px;margin:6px 0;font-size:13px}
.banner-ok{background:#14401f;color:#bff0c8;padding:6px 10px;border-radius:6px;margin:6px 0;font-size:13px}
.node.pass{border-width:3px;box-shadow:0 0 0 2px #fff,0 0 12px #ffcf6b}
.node.pass .nt::after{content:'⚷';margin-left:3px;color:#ffcf6b}
.edge{stroke:rgba(255,255,255,.16);stroke-width:.5;fill:none}
.setnote{font-size:12px;color:var(--muted);margin:4px 0 10px}
.fiscbtn{margin:3px}
.fisc-warn{display:none;margin:6px 0 0;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:bold}
.fisc-warn.show{display:block}
.fisc-warn.warn{background:#5a4a12;color:#ffd24a;border:1px solid #ffd24a}
.fisc-warn.danger{background:#5a1717;color:#ff7a6a;border:1px solid #ff7a6a}
.fisc-warn.flash{animation:fwflash .9s infinite}@keyframes fwflash{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body class="theme-minghuang">
<div id="app">

<script>
/* =======================================================================
   《永恒帝国：龙之纪元》—— 深度重构版（单文件 / 完全离线 / localStorage）
   模块：工具 → 数据 → 状态 → 人才/妃嫔 → 行动点/反馈 → 六部 → 沙盘AI/战斗
        → 后宫 → 卡牌引擎 → 渲染层 → 回合/驾崩 → 设置 → 存档 → 启动
   ======================================================================= */

/* ---------- 0) 工具函数 ---------- */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;     // 含端点随机整数
const rf=(a,b)=>a+Math.random()*(b-a);                     // 浮点随机
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>{n=Math.round(isNaN(n)?0:n);return Math.abs(n)>=10000?(n/10000).toFixed(n%10000?1:0)+'万':(''+n);};
function toast(msg){const t=document.getElementById('toast');const d=document.createElement('div');d.className='toastmsg';d.textContent=msg;t.appendChild(d);setTimeout(()=>{d.style.opacity='0';setTimeout(()=>d.remove(),300);},3000);}
function report(title,pairs){let s=title;pairs.forEach(([k,v])=>{const num=typeof v==='number';s+='\n'+k+' '+(num?(v>=0?'+':'')+Math.round(v):v);});toast(s);}
function log(msg){S.chron.unshift('【第'+S.year+'年·'+S.era+'】'+msg);if(S.chron.length>240)S.chron.pop();}
function showModal(title,html){document.getElementById('modalBox').innerHTML='<h3>'+title+'</h3>'+html+'<div style="margin-top:12px;text-align:right"><button class="btn" onclick="closeModal()">关闭</button></div>';document.getElementById('modal').classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');console.log('closeModal called, S exists:', !!S);if(S){try{renderAll();console.log('renderAll completed');}catch(e){console.error('renderAll failed:', e);}}}
function saveDef(){if(S&&S.settings)saveGame();}

// 种子 / 邀请码 工具
function hashSeed(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function genSeed(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
function genInvite(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
// —— 赛季挑战：按 ISO 周号确定性生成官方种子，每周同一张地图，全球同图竞速 ——
function isoWeekKey(d){d=d||new Date();const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));const wk=Math.ceil(((t-y0)/86400000+1)/7);return t.getUTCFullYear()+'-W'+(wk<10?'0':'')+wk;}
function seasonSeed(){const key='SEASON:'+isoWeekKey();const rng=mulberry32(hashSeed(key));const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=c[Math.floor(rng()*32)];return s;}
function safe(v,d){v=Number(v);return isNaN(v)?(d==null?0:d):v;}

function genName(){return pick(SURNAMES)+pick(GIVEN)+pick(GIVEN);}
function genOfficial(type){
  type=type||pick(['文','武']);
  const r=Math.random();
  const rarity=r<0.05?'橙':r<0.20?'紫':r<0.50?'蓝':'绿';
  const rb={橙:15,紫:10,蓝:5,绿:0}[rarity];
  const six={统率:ri(20,90),武力:ri(20,90),智力:ri(20,90),政治:ri(20,90),魅力:ri(20,90),忠诚:ri(25,98)};
  if(type==='文'){six.政治+=ri(0,18);six.智力+=ri(0,18);}
  if(type==='武'){six.统率+=ri(0,18);six.武力+=ri(0,18);}
  Object.keys(six).forEach(k=>six[k]=clamp(six[k]+rb,1,100));
  // 词条
  const ntr=ri(1,3),trs=[];
  for(let i=0;i<ntr;i++){const t=pick(OFF_TRAITS);if(!trs.includes(t.nm))trs.push(t.nm);}
  trs.forEach(nm=>{const e=TRAIT_EFF[nm];if(!e)return;if(e.dim)six[e.dim]=clamp(six[e.dim]+(e.val||0),1,100);if(e.loyal)six.忠诚=clamp(six.忠诚+(e.loyal||0),1,100);if(e.charm)six.魅力=clamp(six.魅力+(e.charm||0),1,100);});
  const loy=six.忠诚>=70?'忠臣':(six.忠诚<=40?'奸臣':'中立');
  return {id:'of'+Date.now()+''+ri(0,9999),nm:genName(),type,rarity,six,loy,trs,rank:9,post:null};
}
function genConcubine(){

  // 被动技能：橙紫必带、蓝有概率、绿大多无；仅晋升至「妃」以上才激活

/* ---------- 4) 行动点 / 限次 / 反馈 辅助 ---------- */
function spendAP(n=1){if(S.ap<n){toast('行动点不足（本回合剩 '+S.ap+'/'+S.apMax+'）');return false;}S.ap-=n;renderTop();return true;}
function used(key){if(S.limits[key]){toast('本回合已执行（每回合限1次）');return true;}return false;}
function mark(key){S.limits[key]=true;}
// 行动点退还（行动因故未真正执行时调用）
function refundAP(v){S.ap=Math.min(S.apMax,S.ap+(v||1));renderTop();}
// 国库是否负担得起
function canAfford(k){if(k==null||k===undefined)return true;if(S.gold<k){toast('国库不足：需 '+fmt(k)+' 万两，现有 '+fmt(S.gold)+' 万两');return false;}return true;}
// 统一行动前置：先查限次、再查国库，最后才扣行动点 → 失败绝不扣点
function beginAct(key,k){if(key&&used(key))return false;if(!canAfford(k))return false;if(!spendAP())return false;if(key)mark(key);return true;}
function cost(b){return Math.round(b*S.costK*rf(0.8,1.2));}   // 消耗受难度倍率与浮动影响
function minEff(b){return S.posts[b]?1.2:1;}                  // 该部有尚书则效率+20%
function effFate(){return (S?S.fate:0)+((S&&S.mods&&S.mods.fate)||0);}
function powerScore(){return Math.round(S.gold*1.5+S.food*0.03+S.pop*0.04+S.culture*0.5+S.rep*0.6+S.armies.me*0.05+S.heart*0.3+effFate()*0.4+(S.powerBonus||0));}
// 经济景气系数：国库≥50 繁荣+10%；0~10 拮据，征税/征兵-10%
function econMult(kind){if(S.gold>=50)return 1.1;if(S.gold>=0&&S.gold<10)return (kind==='income'||kind==='recruit')?0.9:1;return 1;}
// ===== 平衡性优化：普通模式经济收紧（通胀型胜率修正）=====
// econTight：仅普通模式生效。宽松=0(不收紧) 标准=1(按提示词) 紧张=2(更强)。简单/地狱永远 0，保持不变。
function econTight(){
  if(S.diff!=='normal')return 0;
  const e=(S.settings&&S.settings.econDiff)||'标准';
  return e==='宽松'?0 : e==='紧张'?2 : 1;   // 平衡性优化：普通通关率70.1%偏高，税收系数1.0→0.8、商路/掠夺/俸禄同步收紧
}
// 俸禄率（万两/人·载入）：普通标准=文1.2/武1.8；普通紧张=文1.5/武2.2；其余=文0.8/武1.2
function salaryRate(type){
  if(S.diff==='normal'){const t=econTight();return type==='文'?(t===2?1.7:1.25):(t===2?2.4:1.75);} // 第十三轮回调：文1.4→1.25、武2.0→1.75（征兵改为真实扣款后，需补偿性松绑结构性支出，否则普通档跌破50%）
  return type==='文'?0.8:1.2;
}
// 估算每载入收入（用于财政健康度与入不敷出预警）
function estIncome(){let inc=S.pop*0.018*(0.75+S.heart/200);(S.trades||[]).forEach(t=>inc+=safe(t.income,0));return inc;}
// 财政健康度 A/B/C/D/F（国力评分旁显示）
function fiscalHealth(){
  const g=safe(S.gold,0);
  const exp=officialUpkeep()+S.pop*0.003+S.nodes.filter(n=>n.owner==='me').length*0.6+S.armies.me*0.00015;
  const inc=estIncome();
  if(g>50&&inc>exp*1.5)return {grade:'A',cls:'good'};
  if(g>20&&inc>=exp)return {grade:'B',cls:'good'};
  if(g>5)return {grade:'C',cls:''};
  if(g>=0)return {grade:'D',cls:'bad'};
  return {grade:'F',cls:'bad'};
}
// 官员忠诚缓慢下降
function degradeLoyal(amount,prob){S.officials.forEach(o=>{if(Math.random()<prob)o.six.忠诚=clamp(o.six.忠诚-amount,1,100);});}
// 财政状态分级
function fiscalTier(){if(S.gold>=50)return{t:'繁荣',cls:'ok'};if(S.gold>=10)return{t:'稳健',cls:''};if(S.gold>=0)return{t:'拮据',cls:'warn'};if(S.gold>=-5)return{t:'赤字·轻微',cls:'danger'};if(S.gold>=-20)return{t:'赤字·严重',cls:'danger'};if(S.gold>=-50)return{t:'赤字·危急',cls:'danger'};return{t:'赤字·濒亡',cls:'danger'};}
// 国库枯竭结局判定（低于下限直接亡国）
function bankrupt(){return S.gold<TREASURY_FLOOR;}
// 胜利条件进度
function victoryStatus(){
  const meCities=S.nodes.filter(n=>n.owner==='me').length;
  const list=[
    {nm:'一统九州',prog:meCities+'/'+S.nodes.length+' 城',done:meCities>=S.nodes.length},
    {nm:'国力昌盛',prog:'国力 '+powerScore()+'/4000',done:powerScore()>=4000},
    {nm:'国库充盈',prog:'国库 '+Math.round(S.gold)+'/100 万两',done:S.gold>=100},
    {nm:'文治辉煌',prog:'文化 '+Math.round(S.culture)+'/180',done:S.culture>=180},  // 平衡性优化：文化胜利门槛 200→180（原门槛偏高致文治达成率仅53%，降10%促多元胜利路径
    {nm:'传祚久远',prog:'已历 '+S.year+' 年',done:S.year>=100}
  ];
  const done=list.filter(x=>x.done).length;
  return {list,done,all:done===list.length};
}

/* ---------- 5) 六部行动（均消耗 1 行动点 + 不定量国库，带数值反馈） ---------- */
function actTax(){if(!beginAct('tax'))return;const inc=Math.round(S.pop*0.018*(1+(S.mods.income||0))*(0.75+S.heart/200)*rf(0.9,1.1)*minEff('户')*econMult('income')*taxMul()*(1+concBuffs().tax)*(S.cashIssueTurns>0?0.8:1)*(econTight()===0?1:(econTight()===2?0.60:0.75))); // 第十三轮：修 bug 后真实基线偏低，标准 0.85 / 紧张 0.70 过宽；折中 0.75 / 0.60 保留梯度
S.gold+=inc;S.heart=clamp(S.heart-2,0,S.heartCap);log('户部征税，入库'+fmt(inc)+'万两，民稍苦。');report('户部·征税',[['国库',inc],['民忠',-2]]);renderAll();}
function actRecruit(){const k=cost(ri(10,25));if(!beginAct('recruit',k))return;S.gold-=k;let n=Math.round(rf(1200,3000)*(1+S.mods.armyCap+concBuffs().recruit)*(S.pop/2000)*minEff('兵')*econMult('recruit'));if(S.gold<0&&S.gold>=-20)n=Math.round(n*0.7);S.armies.me+=n;S.food=Math.max(0,S.food-Math.round(n*0.08));log('兵部募兵'+fmt(n)+'，军容稍盛。');report('兵部·募兵',[['兵力',n],['国库',-k]]);renderAll();}
function actBuild(){const k=econTight()? (1.5+Math.random()*0.5) : cost(ri(10,30));if(!beginAct('build',k))return;S.gold-=k;let add=ri(20,30);add=Math.round(add*(1+(S.mods.build||0)));S.projects.build=clamp(S.projects.build+add,0,100);if(S.projects.build>=100){const cul=ri(5,15),rep=ri(3,10);S.culture+=cul;S.rep+=rep;S.projects.build=0;log('兴修水利/城防竣工，文化+'+cul+'，声望+'+rep+'。');report('工部·兴修竣工',[['文化',cul],['声望',rep],['国库',-k]]);}else{report('工部·兴修推进',[['兴修进度','+'+add+'% → '+S.projects.build+'%'],['国库',-k]]);}renderAll();}
function actTalent(){const k=cost(ri(8,20));if(!beginAct('talent',k))return;S.gold-=k;if(Math.random()<0.4*(1+S.mods.talent+concBuffs().talent)){const o=genOfficial(pick(['文','武']));S.officials.push(o);report('吏部·求贤',[['得',o.nm+'('+o.rarity+')'],['国库',-k]]);showOfficials([o]);}else report('吏部·求贤',[['未遇','然德声渐播'],['国库',-k]]);renderAll();}

/* —— 第十三轮：粮食收支模型 ——
   旧版缺陷：nextYear 无产粮也无耗粮，actFarm 为 S.food*0.1 的"乘法增长"，
   一旦因灾荒/征兵归零便永久为 0（0*1.1=0），玩家看到"粮一直为零、毫无用处"。
   改为：每载入结算"产出（人口×粮产加成×治世系数）- 消耗（人口口粮+军粮）"，
   净值为负即饥荒（民忠-2、兵员逃散），归零再追加惩罚；actFarm 改为加法保底，从 0 也能恢复。 */
function foodBudget(){
  const pop=Math.max(1,safe(S.pop,100)),army=Math.max(0,safe(S.armies.me,0));
  const gain=Math.round(pop*0.9*(1+((S.mods&&S.mods.foodG)||0))*(safe(S.order,50)>=60?1.05:1)*(safe(S.heart,50)>=60?1.05:1)); // 治世加成
  const cost=Math.round(pop*0.45+army*0.012); // 人口口粮 + 军粮
  return {gain:gain,cost:cost,net:gain-cost};
}
function applyFoodBudget(){
  const b=foodBudget();S.food=Math.max(0,safe(S.food,0)+b.net);S._foodNet=b.net;
  if(b.net<0){ // 入不敷出：饥荒
    S.heart=clamp(safe(S.heart,50)-2,0,S.heartCap);S.armies.me=Math.max(0,Math.round(safe(S.armies.me,0)*0.99));
    if(S.food<=0){S.heart=clamp(safe(S.heart,50)-2,0,S.heartCap);S.rep=Math.max(0,safe(S.rep,0)-2);
      log('🍚 仓廪空虚，饥民载道：民忠-2，声望-2，兵员逃散。');toast('🍚 粮仓见底！请「劝课农桑」或裁军');}
  }
  return b;
}
function actFarm(){const k=cost(ri(3,8));if(!beginAct('farm',k))return;S.gold-=k;const g=Math.round((safe(S.food,0)*0.06+safe(S.pop,100)*0.6)*rf(0.9,1.1)*(1+S.mods.foodG));S.food+=g;const h=ri(2,5);S.heart=clamp(S.heart+h,0,S.heartCap);log('劝课农桑，粮+'+fmt(g)+'万石，民悦。');report('户部·劝农减灾',[['粮',g],['民忠',h],['国库',-k]]);renderAll();}
function actTrade(){const k=cost(ri(5,15));if(!beginAct('trade',k))return;S.gold-=k;const h=ri(2,6);S.heart=clamp(S.heart+h,0,S.heartCap);S.food=Math.round(S.food*rf(0.98,1.02));log('平粜均输，通有无，民稍安。');report('户部·平粜均输',[['民忠',h],['国库',-k]]);renderAll();}
function actCensus(){if(!beginAct('census'))return;let h='<p>当前人口 <b>'+fmt(S.pop)+'</b> 万</p><p>年增长率 <b>'+ (S.growth*100).toFixed(1) +'%</b></p><p>各州人口增长（本载入）：</p><div class="muted">';const zhous={};S.nodes.forEach(n=>{if(n.owner==='me')zhous[n.zhou]=(zhous[n.zhou]||0)+Math.round(S.pop*0.01);});h+=Object.keys(zhous).map(z=>z+' +'+zhous[z]).join('　');h+='</div><p class="muted">己方城池 '+S.nodes.filter(n=>n.owner==='me').length+' 座｜总兵力 '+fmt(S.armies.me)+'</p>';showModal('户部·人口普查',h);}

function actDiplo(){const ts=S.forces.filter(f=>f.id!=='me'&&f.relation['me']!=='盟');if(!ts.length){toast('当前无可结盟之势力');return;}const k=cost(ri(8,20));if(!beginAct('diplo',k))return;let h='<p>选择结盟势力（成功率受魅力+智力影响，限1个）：</p>';ts.forEach(f=>{h+='<button class="btn" onclick="doDiplo(\''+f.id+'\','+k+')">'+f.name+'</button> ';});showModal('礼部·外交结盟',h);}
function doDiplo(fid,k){if(!canAfford(k))return;S.gold-=k;const f=S.forces.find(x=>x.id===fid);const me=S.officials.find(o=>o.type==='文')||{six:{魅力:50,智力:50}};const chance=0.4+(me.six.魅力+me.six.智力)/400;if(Math.random()<chance){f.relation['me']='盟';f.peace=3;S.rep+=ri(3,8);log('与'+f.name+'结盟，边疆稍安。');report('外交结盟成功',[['与',f.name],['声望',ri(3,8)],['国库',-k]]);toast(f.name+' 已结盟：3回合内不进攻并进贡');}else{report('外交未成',[['国库',-k]]);}closeModal();renderAll();}
function actSacrifice(){const k=cost(ri(30,60));if(!beginAct('sac',k))return;S.gold-=k;const w=ri(5,15),h=ri(5,15);S.rep+=w;S.heart=clamp(S.heart+h,0,S.heartCap);log('祭天大典，威望民忠俱增。');report('礼部·祭天大典',[['威望',w],['民忠',h],['国库',-k]]);renderAll();}
function actDrill(){const k=cost(ri(10,25));if(!beginAct('drill',k))return;S.gold-=k;const extra=Math.min(cost(ri(0,10)),Math.max(0,Math.round(S.gold-TREASURY_FLOOR)));S.gold-=extra;const pw=ri(3,15);S.powerBonus+=pw;S.morale=clamp(S.morale+10,0,100);log('操演三军，国力+'+pw+'。');report('兵部·操演军士',[['国力评分',pw],['国库',-(k+extra)]]);renderAll();}
function actBorder(){const k=cost(ri(8,20));if(!beginAct('border',k))return;S.gold-=k;const add=ri(33,40);S.projects.border=clamp(S.projects.border+add,0,100);if(S.projects.border>=100){let mn=999,mx=0;S.nodes.forEach(n=>{if(n.owner==='me'){const v=ri(5,20);n.def+=v;mn=Math.min(mn,v);mx=Math.max(mx,v);}});S.projects.border=0;log('整饬边备完工，诸关防御提升。');report('兵部·整饬边备完成',[['诸关防御','+'+mn+'~'+mx],['国库',-k]]);}else{report('兵部·整饬边备推进',[['进度','+'+add+'% → '+S.projects.border+'%'],['国库',-k]]);}renderAll();}
function actAntiCorrupt(){const k=cost(ri(10,25));if(!beginAct('antic',k))return;S.gold-=k;const o=Math.round(ri(5,20)*(1+concBuffs().order)),pw=ri(3,10);S.order=clamp(S.order+o,0,100);S.powerBonus+=pw;S.corrupt=clamp(S.corrupt-0.1,0,1);log('肃清贪腐，吏治为清。');report('刑部·肃清贪腐',[['治安',o],['国力',pw],['国库',-k]]);renderAll();}
function actLenient(){const k=cost(ri(5,15));if(!beginAct('lenient',k))return;S.gold-=k;const h=ri(5,20),o=-ri(3,10);S.heart=clamp(S.heart+h,0,S.heartCap);S.order=clamp(S.order+o,0,100);log('宽刑恤民，民心悦附。');report('刑部·宽刑恤民',[['民忠',h],['治安',o],['国库',-k]]);renderAll();}
function actPalace(){const plv=(S.palaceLv||0);const k=econTight()? (3+plv*0.5+Math.random()*1) : cost(ri(15,40));if(!beginAct('palace',k))return;S.palaceLv=plv+1;S.gold-=k;const cul=ri(5,20),rep=ri(3,15);S.culture+=cul;S.rep+=rep;log('营建宫室，壮丽逾前。');report('工部·营建宫室',[['文化',cul],['声望',rep],['国库',-k]]);renderAll();}
function actTech(){const k=econTight()? (2+Math.random()*0.8) : cost(ri(15,40));if(!beginAct('tech',k))return;S.gold-=k;let add=ri(10,20);add=Math.round(add*(1+(S.mods.build||0)));S.projects.tech=clamp(S.projects.tech+add,0,100);if(S.projects.tech>=100){const w=pick(WEAPONS);S.tech+=w.bonus;S.weapons=w;S.projects.tech=0;log('研制 '+w.nm+' 成功，攻城伤害+'+w.bonus+'%！');report('工部·火器研制成功',[['获得',w.nm],['攻城伤害','+'+w.bonus+'%'],['国库',-k]]);}else{report('工部·火器研制推进',[['火器进度','+'+add+'% → '+S.projects.tech+'%'],['国库',-k]]);}renderAll();}
function actLegislate(){if(S.laws.length>=LAWS.length){toast('律令已齐备');return;}const k=cost(ri(10,25));if(!beginAct('legis',k))return;let h='<p>选择新法律（永久生效）：</p>';LAWS.forEach(l=>{if(!S.laws.find(x=>x.id===l.id))h+='<button class="btn" onclick="doLegislate(\''+l.id+'\','+k+')">'+l.nm+'：'+l.desc+'</button><br>';});showModal('刑部·立法改革',h);}
function doLegislate(id,k){if(!canAfford(k))return;S.gold-=k;const l=LAWS.find(x=>x.id===id);S.laws.push(l);applyLaw(l);log('颁行《'+l.nm+'》。');report('立法·'+l.nm,[['国库',-k]]);closeModal();renderAll();}
function applyLaw(l){if(l.eff.order)S.order=clamp(S.order+l.eff.order,0,100);if(l.eff.heart)S.heart=clamp(S.heart+l.eff.heart,0,S.heartCap);if(l.eff.income)S.mods.income+=l.eff.income;if(l.eff.talent)S.mods.talent+=l.eff.talent;if(l.eff.armyCap)S.mods.armyCap+=l.eff.armyCap;if(l.eff.foodG)S.mods.foodG+=l.eff.foodG;if(l.eff.culture)S.culture+=l.eff.culture;}
let _apSlot=null;
const AP_SLOTS=[['吏','吏部尚书','文'],['户','户部尚书','文'],['礼','礼部尚书','文'],['兵','兵部尚书','文'],['刑','刑部尚书','文'],['工','工部尚书','文'],['g北','北路统帅','武'],['g南','南路统帅','武'],['g西','西路统帅','武'],['g东','东路统帅','武']];
function actAppoint(){if(!beginAct('appoint'))return;_apSlot=null;showAppoint();}
function showAppoint(){
  let h='<p class="muted">点「选择」→ 再点人才名即可任命。尚书：该部效率+20%；统帅：该战区征战+15。一人不可兼任两职。</p>';
  AP_SLOTS.forEach(sl=>{
    const cur=S.posts[sl[0]]?S.officials.find(o=>o.id===S.posts[sl[0]]):null;
    const rc=cur?({橙:'#ff9d2e',紫:'#b06bff',蓝:'#4aa3ff',绿:'#5fbf7a'}[cur.rarity]||''):'';
    h+='<div class="setrow"><span>'+sl[1]+'：'+(cur?'<b style="color:'+rc+'">'+cur.nm+'</b> <span class="muted">'+rankName(cur.rank)+'·'+cur.rarity+'·智'+cur.six.智力+'</span>':'<span class="muted">（空缺）</span>')+'</span><span><button class="btn sm" onclick="pickSlot(\''+sl[0]+'\')">选择</button> <button class="btn sm" onclick="clearSlot(\''+sl[0]+'\')">撤职</button></span></div>';
  });
  if(_apSlot){
    const sl=AP_SLOTS.find(x=>x[0]===_apSlot)||AP_SLOTS[0];
    const cand=S.officials.filter(o=>o.type===sl[2]).sort((a,b)=>((b.six.智力+b.six.政治)-(a.six.智力+a.six.政治)));
    h+='<hr><p class="h">为「'+sl[1]+'」择人（按才学排序）：</p><div class="row" style="flex-wrap:wrap">';
    if(!cand.length)h+='<span class="muted">当前无可用'+(sl[2]==='文'?'文臣':'武将')+'，请先「科举取士」。</span>';
    cand.forEach(o=>{const rc={橙:'#ff9d2e',紫:'#b06bff',蓝:'#4aa3ff',绿:'#5fbf7a'}[o.rarity]||'#888';h+='<button class="btn sm" style="margin:3px;border-color:'+rc+';'+(S.posts[_apSlot]===o.id?'background:var(--gold);color:#1a1206':'')+'" onclick="doPick(\''+o.id+'\')">'+o.nm+' <span style="color:'+rc+'">'+o.rarity+'</span>·智'+o.six.智力+'·政'+o.six.政治+'·'+rankName(o.rank)+'</button>';});
    h+='</div>';
  }
  h+='<div class="row" style="margin-top:10px"><button class="btn gold" onclick="closeAppoint()">完成任免</button></div>';
  showModal('吏部·任免（点选）',h);
}
function pickSlot(k){_apSlot=k;showAppoint();}
function clearSlot(k){S.posts[k]=null;if(_apSlot===k)_apSlot=null;showAppoint();}
function doPick(oid){Object.keys(S.posts).forEach(k=>{if(S.posts[k]===oid)S.posts[k]=null;});S.posts[_apSlot]=oid;const o=S.officials.find(x=>x.id===oid);_apSlot=null;if(o)toast('已任命 '+o.nm);showAppoint();}

function actPromote(){const list=S.officials.filter(o=>o.rank>1);if(!list.length){toast('已无可晋升之官员（皆一品）');return;}const k=cost(ri(10,30));if(!beginAct('promote',k))return;const rate=clamp(0.3+S.rep/200,0.3,0.95);let h='<p>选择晋升官员（成功率 '+(rate*100).toFixed(0)+'%，受威望影响）：</p>';list.forEach(o=>{h+='<button class="btn" onclick="doPromote(\''+o.id+'\','+k+')">'+o.nm+' '+rankName(o.rank)+'→'+rankName(o.rank-1)+'</button><br>';});showModal('吏部·晋升',h);}

/* ---------- 5.5) 国库与破产机制（赤字惩罚 / 应急六策 / 亡国） ---------- */
function coolLeft(key,cool){const last=(S.emerg||{})[key];if(last===undefined||last===null||last<0)return 0;const d=S.year-last;return d>=cool?0:cool-d;}
function econDesc(){if(S.gold>=50)return '繁荣昌盛：全国增益 +10%';if(S.gold>=10)return '稳健运营';if(S.gold>=0)return '拮据：征税与征兵效率 -10%';if(S.gold>-5)return '轻微赤字：民忠-1/载入，官员忠诚缓降';if(S.gold>-20)return '严重赤字：民忠-3/载入，忠诚-2，征兵-30%';if(S.gold>-50)return '危急赤字：民忠-5/载入，有兵变之险';return '濒亡赤字：民忠-8/载入，每载入10%亡国';}
function fiscalBanner(){
  const g=Math.round(S.gold);let h='';
  if(S.gold>=50)h+='<div class="banner-ok">💰 国库充盈 '+g+' 万两 · 繁荣昌盛（全国增益 +10%）</div>';
  else if(S.gold>=10)h+='<div class="banner-ok">💰 国库稳健 '+g+' 万两</div>';
  else if(S.gold>=0)h+='<div class="banner-warn">⚠ 国库拮据 '+g+' 万两 · 征税与征兵效率 -10%</div>';
  else h+='<div class="banner-danger">🚨 财政赤字 '+g+' 万两（下限 -100）· '+econDesc()+'</div>';
  if(S.gold<=-50)h+='<div class="banner-danger">☠ 亡国倒计时：已跌破 -50 万两，每载入 10% 概率亡国</div>';
  if(S.debt>0)h+='<div class="banner-warn">📜 外债未偿：欠 '+Math.round(S.debt)+' 万两，余 '+S.debtTurns+' 载入（每载入约还 '+Math.round(S.debt/Math.max(1,S.debtTurns))+' 万两）</div>';
  if(S.cut)h+='<div class="banner-ok">✂ 已裁撤冗余：俸禄永久 -40%</div>';
  return h;
}
function emergPanel(){
  let h='<div class="card3" style="margin-top:10px"><p class="h">🆘 应急六策（赤字救急；除变卖珍宝、割地求和外均耗 1 行动点）</p><div class="row" style="flex-wrap:wrap">';
  h+='<button class="btn sm fiscbtn" '+((S.ap<1||coolLeft('tax',5)>0)?'disabled':'')+' onclick="emTax()">紧急征税'+(coolLeft('tax',5)>0?'（'+coolLeft('tax',5)+'载入后可）':'')+'</button>';
  h+='<button class="btn sm fiscbtn" '+((S.ap<1||coolLeft('sell',10)>0)?'disabled':'')+' onclick="emSellOffice()">卖官鬻爵'+(coolLeft('sell',10)>0?'（'+coolLeft('sell',10)+'载入后可）':'')+'</button>';
  h+='<button class="btn sm fiscbtn" '+((S.ap<1||S.debt>0)?'disabled':'')+' onclick="emLoan()">借外债'+(S.debt>0?'（未还清）':'')+'</button>';
  h+='<button class="btn sm fiscbtn" '+((S.ap<1||S.cut)?'disabled':'')+' onclick="emCut()">裁撤冗余'+(S.cut?'（已裁）':'')+'</button>';
  h+='<button class="btn sm fiscbtn" '+(S.treasures<=0?'disabled':'')+' onclick="emTreasury()">变卖珍宝（0点·余'+S.treasures+'件）</button>';
  h+='<button class="btn sm fiscbtn" onclick="emCede()">割地求和（0点）</button>';
  h+='</div><div class="muted" style="margin-top:6px">紧急征税：民忠-5，每5载入1次｜卖官鬻爵：得银但必招奸臣，每10载入1次｜借外债：立即得银，未来10载入连本带息偿还｜裁撤冗余：永久省俸禄，治安-5｜变卖珍宝：0行动点，每件换银｜割地求和：0行动点，割城换银但民忠威望大跌</div></div>';
  return h;

/* ---------- 6) 沙盘：地图 / 势力AI / 战斗 ---------- */
function buildMap(){
  S.nodes=NODE_DEFS.map(n=>({id:n.id,name:n.name,zhou:n.zhou,x:n.x,y:n.y,owner:n.owner,special:!!n.special,pass:false,def:Math.floor(RNG()*31)+10,troop:Math.floor(RNG()*49001)+1000}));
  S.forces=FORCE_DEFS.map(f=>({id:f.id,name:f.name,color:f.color,ai:f.ai,gold:ri(5000,30000),relation:{},peace:0,generals:[]}));
  // 各势力将领
  S.forces.forEach(f=>{if(f.id!=='me'){for(let i=0;i<ri(3,5);i++)f.generals.push(genOfficial('武').id);}});
  // 守城名将：每个 AI 势力 1~2 名名将驻守重镇（关卡优先），城防与驻军大增
  S.starGens=[];
  S.forces.forEach(f=>{if(f.id==='me')return;
    const own=S.nodes.filter(n=>n.owner===f.id);
    if(!own.length)return;
    const cnt=own.length>=4?2:1;
    const sorted=own.slice().sort((a,b)=>((b.pass?1:0)-(a.pass?1:0))||(b.def-a.def));
    for(let i=0;i<cnt&&i<sorted.length;i++){const c=sorted[i];
      const star={id:'sg_'+f.id+'_'+i,nm:genName(),lead:75+Math.floor(RNG()*21),might:ri(70,95),wit:ri(60,90),force:f.id,city:c.id,loyal:ri(70,95),trs:[pick(OFF_TRAITS).nm,pick(OFF_TRAITS).nm]};
      S.starGens.push(star);
      c.def+=Math.floor(star.lead/4);c.troop+=2000+Math.floor(RNG()*3001);
    }});
  buildEdges();
}
/* 随机连接路线：每城随机连 2~3 个近邻（带随机扰动，每局路线不同），再用 Prim 保证全图连通 */
function buildEdges(){
  const N=S.nodes,E=[],seen={};
  const addE=(a,b)=>{const k=(a<b?a+'|'+b:b+'|'+a);if(seen[k])return;seen[k]=1;E.push({a:a,b:b});};
  N.forEach(n=>{
    const near=N.filter(m=>m!==n).map(m=>({id:m.id,d:dist(n,m)+RNG()*14})).sort((x,y)=>x.d-y.d);
    const k=2+Math.floor(RNG()*2);
    near.slice(0,k).forEach(x=>addE(n.id,x.id));
  });
  // Prim 补边，确保任意两城可达（否则会出现孤岛无法出征）
  const inT={};inT[N[0].id]=1;let rest=N.slice(1).map(n=>n.id);
  const nodeById={};N.forEach(n=>nodeById[n.id]=n);
  while(rest.length){
    let best=null,bd=Infinity;
    for(const a in inT){const na=nodeById[a];
      rest.forEach(b=>{const d=dist(na,nodeById[b]);if(d<bd){bd=d;best=[a,b];}});}
    if(!best)break;
    addE(best[0],best[1]);inT[best[1]]=1;rest.splice(rest.indexOf(best[1]),1);
  }
  S.edges=E;
  // 重要关口：连通度（度数）最高的 6 座城设为雄关，防御与驻军加成
  const deg={};E.forEach(e=>{deg[e.a]=(deg[e.a]||0)+1;deg[e.b]=(deg[e.b]||0)+1;});
  const ranked=N.slice().sort((a,b)=>(deg[b.id]||0)-(deg[a.id]||0));
  S.passes=ranked.slice(0,6).map(n=>n.id);
  S.passes.forEach(id=>{const n=nodeById[id];if(n){n.pass=true;n.def+=Math.floor(RNG()*16)+15;n.troop+=Math.floor(RNG()*6001)+2000;}});
}
// 沿连线取邻城（替代原先的距离判定）
function neighborsOf(nid){if(!S.edges)return [];const out=[];S.edges.forEach(e=>{const o=(e.a===nid?e.b:(e.b===nid?e.a:null));if(o)out.push(S.nodes.find(n=>n.id===o));});return out.filter(Boolean);}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
// 只沿连线判定邻敌（不再按直线距离，关口价值因此体现）
function enemyNeighbors(fid){const own=S.nodes.filter(n=>n.owner===fid);const out=[];own.forEach(n=>{neighborsOf(n.id).forEach(m=>{if(m&&m.owner!==fid&&m.owner!=='neutral'&&out.indexOf(m)<0)out.push(m);});});return out;}
function counterType(a,b){ // 骑>弓>步>骑
  if(a===b)return 1;
  const m={骑:['弓'],弓:['步'],步:['骑']};
  return m[a]&&m[a].includes(b)?1.3:0.8;
}
function resolveBattle(afid,fromId,toId,mode,troops,genId){
  const from=S.nodes.find(n=>n.id===fromId),tn=S.nodes.find(n=>n.id===toId);
  if(!from||!tn)return;
  const prevOwner=tn.owner;
  // —— NaN 兜底：所有参战数值必须有初始值（空值容错） ——
  troops=Math.max(0,safe(troops,0));tn.troop=Math.max(0,safe(tn.troop,0));from.troop=Math.max(0,safe(from.troop,0));tn.def=safe(tn.def,10);
  const of=S.forces.find(f=>f.id===afid),df=S.forces.find(f=>f.id===prevOwner);
  const gId=genId||(of.generals&&of.generals[0]);
  const gen=gId?S.officials.find(o=>o.id===gId):null;
  const genB=(gen?gen.six.统率:40)+(S.mods.genLead||0)+(S.posts['g'+frontZone(from)]?15:0);
  const myType=pick(['骑','弓','步']),enType=pick(['骑','弓','步']);
  let atk=troops*(1+genB/120)*(1+S.mods.atk)*counterType(myType,enType);
  if(mode==='siege')atk*=(1+(S.weapons?S.weapons.bonus/100:0));
  if(mode==='naval')atk*=0.9;
  const defP=tn.troop*(1+tn.def/200)*(1+(df?0.05:0))*((prevOwner==='me'&&S.garrison&&S.garrison[tn.id])?1.15:1); // 平衡性优化：城防/驻将隐性加成减半(def/200·驻将+15%·敌方+5%)，让兵力真正主导，消除"小城防放大成几万"
  const win=atk>defP*rf(0.85,1.15);
  const isMe=afid==='me';
  if(win){
    tn.owner=afid;const remain=Math.round(troops*0.5);tn.troop=remain;from.troop-=troops;
    if(prevOwner!==afid)afterCityFall(tn,false); // 守方名将突围转进他城
    if(isMe){S.armies.me=Math.max(0,safe(S.armies.me,0)-troops);S.rep+=2;log('攻克 '+tn.name+'！');toast('⚔ 攻克 '+tn.name);}else{toast('⚔ '+of.name+' 攻取 '+tn.name);}
    if(gen&&Math.random()<0.15)toast('（'+gen.nm+' 威名远扬）');
    if(prevOwner==='me'&&!S.nodes.some(n=>n.owner==='me')){log('疆土尽失，'+S.era+' 王朝落幕。');endGame('战败','城破国灭，山河易主');return;}
  }else{
    const loss=Math.round(troops*0.7);from.troop=Math.max(0,from.troop-loss);tn.troop=Math.max(0,tn.troop-Math.round(atk*0.3));
    if(isMe){S.armies.me=Math.max(0,safe(S.armies.me,0)-loss);log('攻 '+tn.name+' 受挫，损兵 '+fmt(loss)+'。');toast('⚔ 攻 '+tn.name+' 受挫，损兵 '+fmt(loss));}else{toast('⚔ 击退 '+of.name+' 来犯');}
  }
  fromNode=null;toNode=null;renderSandbox();
}
function frontZone(n){ // 粗略战区（按x坐标）
  if(n.x<45)return '西';if(n.x>65)return '东';if(n.y<42)return '北';return '南';
}
function sandboxAI(){
  // 第十二轮：进攻频次随 aiK 连续缩放（旧逻辑 times=aiK>=2?2:1 在 1~2 间恒为1，动态难度的"过强加压"对普通档形同虚设）
  S.forces.forEach(f=>{
    if(!f.ai)return;
    const acts=Math.max(1,Math.round(ri(1,2)*S.aiK)); // 简单(0.5)≈1次、普通(1)1~2次、地狱(2)2~4次、国力过强时 aiK 放大→施压雪球流
    for(let a=0;a<acts;a++){
      const my=S.nodes.filter(n=>n.owner===f.id);
      if(!my.length)continue;
      const r=Math.random();
      if(r<0.5){ // 进攻（尊重盟约与藩属，不攻盟友/藩国；对我方有和平期则罢兵）
        const tgs=enemyNeighbors(f.id).filter(t=>{const rf2=S.forces.find(x=>x.id===t.owner);if(rf2&&(f.relation[rf2.id]==='盟'||f.relation[rf2.id]==='藩'))return false;if(t.owner==='me'&&f.peace>0)return false;if(t.owner==='me'&&S.defend)return false;return true;}); // 我方正处守城战时，诸军观望
        if(tgs.length){const t=pick(tgs);const from=my.reduce((p,c)=>dist(c,t)<dist(p,t)?c:p);const tr=Math.round(from.troop*rf(0.4,0.7));
          if(t.owner==='me'&&t.troop>=500&&tr>=800&&Math.random()<0.65&&!S.defend){startDefense(f.id,from,t,tr);} // 攻我城 → 守城战玩法
          else resolveBattle(f.id,from.id,t.id,pick(['field','siege','naval']),tr);}
      }else if(r<0.75){ // 征兵
        const n=pick(my);n.troop+=ri(500,3000);  // 恢复AI可自然成长（保留后期挑战与反杀失败通道）；僵局改由炼狱天命Buff+400载入国力碾压归顺破局，而非简单压低守军
      }else{ // 外交
        const o=pick(S.forces.filter(x=>x.id!==f.id));
        if(Math.random()<0.3){f.relation[o.id]='盟';o.relation[f.id]='盟';}else f.relation[o.id]='敌';
      }
    }
  });
}
// 平衡性优化：国力碾压投降——玩家国力≥某AI势力国力×3 且 声望≥80 且有智力≥70文臣时，该势力每载入15~25%概率举国归顺（城池和平交接），破后期僵局
// 400载入后进入"破僵局"模式(relaxed)：门槛降至2倍国力、概率30~50%、无需威望/智臣，专治"国力碾压却推不动"的僵局
function dominateSurrender(relaxed){
  const myC=S.nodes.filter(n=>n.owner==='me').length;
  const myTroops=S.armies.me+myC*2000;
  const hasSmart=(S.officials||[]).some(o=>o.type==='文'&&o.six.智力>=70);
  const need=relaxed?2:3;
  if(!relaxed && (S.rep<80||!hasSmart))return;
  S.forces.forEach(f=>{
    if(!f.ai||f.relation['me']==='藩'||f.relation['me']==='盟')return;
    const fC=S.nodes.filter(n=>n.owner===f.id);
    const fTroops=fC.reduce((s,n)=>s+n.troop,0)+fC.length*2000;
    const p=relaxed?rf(0.3,0.5):rf(0.15,0.25);
    if(myTroops>=fTroops*need && Math.random()<p){
      fC.forEach(n=>{n.owner='me';n.troop=Math.round(n.troop*0.5);});
      f.relation['me']='藩';S.rep+=5;log('🏮 '+f.name+' 慑于天威，举国归顺！');toast('🏮 '+f.name+' 归顺');
    }
  });
}

function birthChild(c){

  const p={id:'pr'+Date.now()+''+ri(0,9999),nm:genName(),son:isSon,age:0,six,rarity,talent:pick(['文','武','政','商','艺']),cultivate:0,status:'幼年',isHeir:false};

function marryQueen(id){if(S.queen){toast('已有皇后');return;}const c=S.concubines.find(x=>x.id===id);if(!c)return;if(c.rarity==='绿'&&c.six.家世<80&&c.six.才情<90){toast('需家世≥80或才情≥90方可立后');return;}const k=Math.max(8,Math.round(S.gold*0.15));if(!beginAct('queen',k))return;S.gold-=k;S.queen=c.id;c.title='皇后';S.rep+=10;log('立 '+c.nm+' 为皇后。');report('立后',[['皇后',c.nm],['国库',-k]]);renderAll();}
function abolishQueen(){if(!S.queen)return false;const k=Math.max(20,Math.round(S.gold*0.5));if(S.gold<k){toast('国库不足以废后（需 '+fmt(k)+' 万两）');return false;}S.gold-=k;const c=S.concubines.find(x=>x.id===S.queen);if(c){c.title='贵人';S.queen=null;}S.heart=clamp(S.heart-20,0,S.heartCap);S.rep-=30;if(Math.random()<0.4){eventRebellion('废后引发朝臣反对');}log('废后，朝野震荡。');report('废后',[['国库',-k],['民忠',-20],['威望',-30]]);renderAll();return true;}
function makeHeir(id){const p=S.princes.find(x=>x.id===id);if(!p||!p.son){toast('仅皇子可立储');return;}if(p.six.智力<70&&p.six.统率<70){toast('需智力≥70或统率≥70方可立储');return;}const k=cost(ri(10,25));if(!beginAct('heir',k))return;S.gold-=k;S.princes.forEach(x=>x.isHeir=false);p.isHeir=true;S.heir=p.nm;log('立 '+p.nm+' 为太子。');report('立太子',[['太子',p.nm],['国库',-k]]);renderAll();}
function abolishHeir(){const p=S.princes.find(x=>x.isHeir);if(!p)return false;const k=Math.max(12,Math.round(S.gold*0.3));if(S.gold<k){toast('国库不足以废太子（需 '+fmt(k)+' 万两）');return false;}S.gold-=k;p.isHeir=false;S.heir=null;if(Math.random()<0.5)eventRebellion('废太子引发夺嫡之乱');log('废太子，诸子夺嫡。');report('废太子',[['国库',-k]]);renderAll();return true;}

const CARD_DEFS=BASE_CARDS.concat(EXTRA_CARDS);
let CARD_MAP={}; CARD_DEFS.forEach(c=>CARD_MAP[c.id]=c);
function findCard(id){return CARD_MAP[id];}
function mkCardInst(id){const c=findCard(id);return {id:id,uid:'u'+Date.now()+''+ri(0,9999),lv:1};}
function grantCard(id){const c=findCard(id);if(!c)return;if(S.deck.length<10)S.deck.push(mkCardInst(id));else S.warehouse.push(mkCardInst(id));checkCollection();}
function equip(id){const i=S.warehouse.findIndex(c=>c.id===id);if(i<0)return;if(S.deck.length>=10){toast('卡组已满（10）');return;}const c=S.warehouse.splice(i,1)[0];S.deck.push(c);if(c.grant)S.officials.push(genOfficial(c.grant));if(c.sp==='accel'){S.projects.build=clamp(S.projects.build+30,0,100);S.projects.tech=clamp(S.projects.tech+30,0,100);}if(c.sp==='ap1')S.ap+=1;applyDeck();toast('装备 '+findCard(id).nm);renderAll();}
function unequip(id){const i=S.deck.findIndex(c=>c.id===id);if(i<0)return;const c=S.deck.splice(i,1)[0];S.warehouse.push(c);applyDeck();renderAll();}
function applyDeck(){S.mods=Object.assign({income:0,admin:0,build:0,foodG:0,talent:0,diplo:0,armyCap:0,atk:0,def:0,corrupt:0,tech:0,heartCap:0,genLed:0,central:0,fate:0},{});S.laws.forEach(applyLaw);S.deck.forEach(inst=>{const c=findCard(inst.id);if(!c)return;if(c.cat==='event')return;if(c.mods)for(const k in c.mods)S.mods[k]=(S.mods[k]||0)+c.mods[k]*inst.lv;});S.heartCap=S.heartBase+(S.mods.heartCap||0);}
function openEventDraw(){
  const free=!used('draw');
  if(!free&&!(S.bonusDraw>0)){toast('本载入已抽过；生成分享图可获得额外抽策机会');return;}
  if(!spendAP())return;
  if(free)mark('draw');else{S.bonusDraw--;toast('消耗 1 次分享抽策机会');}
  const c=pick(CARD_DEFS);grantCard(c.id);log('抽策，得《'+c.nm+'》。');report('抽策',[['得',c.nm+'('+catName(c.cat)+')']]);
  if(c.r>=3)setTimeout(()=>showRareCard(c.id),60);
  renderAll();
}
function showRareCard(id){
  const c=findCard(id);if(!c)return;const rc=RC_MAP[c.r];
  let h='<p style="text-align:center;font-size:22px;color:'+rc[1]+'">✨ 天降'+rc[0]+'！</p>';
  h+='<p style="text-align:center"><b style="font-size:26px;color:var(--ink)">'+c.nm+'</b><span class="muted">（'+catName(c.cat)+'·'+'★'.repeat(c.r)+'）</span></p>';
  h+='<p class="muted" style="text-align:center">'+c.desc+'</p>';
  h+='<p class="muted" style="text-align:center;font-size:13px">好卡独乐乐不如众乐乐——生成分享图发出去，还能领今日抽策奖励</p>';
  h+='<div class="row" style="justify-content:center"><button class="btn gold" onclick="downloadCardShare(\''+c.id+'\')">生成炫耀分享图</button><button class="btn" onclick="copyCardText(\''+c.id+'\')">复制战报文案</button><button class="btn" onclick="closeModal()">收下</button></div>';
  showModal('稀世策卡 · '+c.nm,h);
}

function upgradeCard(id){const inst=S.deck.concat(S.warehouse).find(c=>c.uid===id);if(!inst){toast('卡不在手');return;}if(inst.lv>=3){toast('已满级');return;}const k=cost(15*inst.lv);if(S.gold<k){toast('国库不足');return;}S.gold-=k;inst.lv++;report('卡牌升级',[['至','Lv'+inst.lv],['国库',-k]]);renderAll();}
function synthesize(id){const inst=S.deck.concat(S.warehouse).find(c=>c.uid===id);if(!inst)return;const same=S.deck.concat(S.warehouse).filter(c=>c.id===inst.id);if(same.length<3){toast('需3张同卡合成');return;}const k=cost(200);if(S.gold<k){toast('国库不足');return;}for(let i=0;i<3;i++){const idx=S.warehouse.findIndex(c=>c.id===inst.id);if(idx>=0)S.warehouse.splice(idx,1);else{S.deck.splice(S.deck.findIndex(c=>c.id===inst.id),1);}}S.gold-=k;const up=mkCardInst(inst.id);up.lv=Math.min(3,inst.lv+1);if(S.deck.length<10)S.deck.push(up);else S.warehouse.push(up);report('合成成功',[['新卡','Lv'+up.lv],['国库',-k]]);applyDeck();renderAll();}
function playCard(id){const inst=S.deck.find(c=>c.uid===id);if(!inst)return;const c=findCard(id);if(c.cat!=='event'){toast('仅事件卡可即时打出');return;}if(!spendAP())return;toast('打出《'+c.nm+'》：'+c.desc);if(c.gain){if(c.gain.gold)S.gold+=c.gain.gold;if(c.gain.heart)S.heart=clamp(S.heart+c.gain.heart,0,S.heartCap);if(c.gain.rep)S.rep+=c.gain.rep;if(c.gain.culture)S.culture+=c.gain.culture;if(c.gain.food)S.food+=c.gain.food;if(c.gain.fate)S.fate=clamp(S.fate+c.gain.fate,0,100);}if(c.grant)S.officials.push(genOfficial(c.grant));if(c.sp==='ap1')S.ap+=1;log('打出事件卡《'+c.nm+'》。');applyDeck();renderAll();}

/* ---------- 10) 回合 / 驾崩 / 动态难度 ---------- */
function nextYear(){
  if(!S)return;
  if(S.dead){toast('王朝已终结，可刷新页面重开新朝');return;}
  if(S.defend&&!S.defend.done){autoDefendHold();} // 平衡性优化：无AP也自动闭城死守，不再被迫弃城
  if(S.siege&&S.siege.progress<100){ // 平衡性优化：攻城转持续状态，推进时间也自动围困
    const _rs={'强攻':1.1,'围城':0.6,'离间':0.8}[S.siege.strat]||1;
    const _lr=siegeGenLead();let _ra=(12+_lr/12)*_rs*rf(0.85,1.2);
    const _rr=S.siege.committed/Math.max(1,S.siege.enemyTroop);
    const _rk2=_rr>=10?2.6:_rr>=5?2.0:_rr>=3?1.6:_rr>=2?1.3:_rr>=1?1.05:_rr>=0.6?0.8:0.55; // 第十三轮修复：与 siegeStep 同步的比例缩放（自动围困同样体现兵力优势）
    _ra*=_rk2;
    if(_rr>=10)_ra+=14;else if(_rr>=5)_ra+=6;
    S.siege.progress=clamp(S.siege.progress+_ra,0,100);
    S.siege.turn++;
    if(Math.random()<0.3)if(siegeEvent())return; // 决策事件仍挂起
    if(S.siege.progress>=100){toast('⚔ '+S.nodes.find(n=>n.id===S.siege.to).name+' 城防将破，下一载入点击总攻！');S.siege.progress=100;}
  }
  // —— NaN 全量兜底（数值边界保护：任何异常值回到默认值） ——
  S.gold=safe(S.gold,0);S.food=Math.max(0,safe(S.food,0));S.pop=Math.max(1,safe(S.pop,100));S.heart=safe(S.heart,50);
  S.rep=safe(S.rep,0);S.culture=safe(S.culture,0);S.order=safe(S.order,50);S.armies.me=Math.max(0,safe(S.armies.me,0));
  S.nodes.forEach(n=>{n.troop=Math.max(0,safe(n.troop,0));n.def=safe(n.def,10);});
  S.year++;S.age++;
  S.limits={};S.ap=S.apMax;S.princes.forEach(p=>{p.cultCount=0;});
  // 官员俸禄（文0.8/武1.2万两·人，腐败推高，裁撤冗余后省四成）
  const upkeep=Math.round((officialUpkeep()+S.pop*0.003+S.nodes.filter(n=>n.owner==='me').length*0.6+S.armies.me*0.00015)*(1+S.corrupt)*(S.cut?0.6:1));  // 平衡性优化：单兵军费系数 0.0002→0.00015（-25%），缓解经济崩溃（第一大死因33%）；配合恢复AI成长保持整体难度不失真
  S.gold-=upkeep;
  if(S.gold<2&&!S._lowWarned){S._lowWarned=true;showModal('🚨 财政危机！', '<p>国库仅 '+Math.round(S.gold)+' 万两，濒临亡国！立即采取紧急措施：</p><div class="row"><button class="btn" onclick="emTax();closeModal()">紧急征税</button><button class="btn" onclick="emSellOffice();closeModal()">卖官鬻爵</button><button class="btn" onclick="emCut();closeModal()">裁撤冗余</button></div><div class="row" style="margin-top:6px"><button class="btn" onclick="closeModal()">稍后再说</button></div>');}  // 平衡性优化：首次国库<2万弹紧急三策
  if(estIncome()<upkeep&&S.gold<10&&S.year!==S._spendWarnYr){toast('⚠ 本载入预计入不敷出，建议开源节流');S._spendWarnYr=S.year;}  // 平衡性优化：预估支出>收入温和预警
  // 商路岁入（敌对关系自动中断）
  if(S.trades&&S.trades.length){S.trades=S.trades.filter(t=>{const f=S.forces.find(x=>x.id===t.fid);return f&&f.relation['me']!=='敌';});let inc=0;S.trades.forEach(t=>inc+=safe(t.income,0));if(inc>0){S.gold+=inc;log('商路岁入 '+inc+' 万两。');}}
  // 附属国进贡
  S.forces.forEach(f=>{if(f.relation['me']==='藩'){const v=ri(3,8);S.gold+=v;if(S.year%3===0)log('藩国 '+f.name+' 进贡 '+v+' 万两。');}});
  // 税率效果（低税养民 / 高税伤民有民变风险）
  if(S.taxes===0)S.heart=clamp(S.heart+2,0,S.heartCap);
  if(S.taxes===2){S.heart=clamp(S.heart-3,0,S.heartCap);if(Math.random()<0.12)eventRebellion('重税之下民怨沸腾');}
  // 通胀（发行货币的代价：10载入内税收-20%、民忠-1/载入）
  if(S.cashIssueTurns>0){S.cashIssueTurns--;S.heart=clamp(S.heart-1,0,S.heartCap);}
  // 外债偿还（借银时已计利息，分期十年）
  if(S.debt>0&&S.debtTurns>0){const pay=Math.max(1,Math.round(S.debt/S.debtTurns));S.gold-=pay;S.debt-=pay;S.debtTurns--;if(S.debt<=0){S.debt=0;S.debtTurns=0;toast('📜 外债已还清');}}
  // 赤字惩罚（严重时刻可直接亡国）
  if(applyDeficit())return;
  if(bankrupt()){doBankrupt('国库亏空已逾百万两，府库如洗，百官星散，社稷倾覆。');return;}
  // 贪官贪污
  S.officials.forEach(o=>{if(o.trs&&o.trs.includes('贪得无厌')){const t=Math.round(S.gold*0.01);S.gold=Math.max(0,S.gold-t);}});
  // 结盟和平倒计时
  S.forces.forEach(f=>{if(f.peace>0)f.peace--;});
  // 子嗣成长与孕产、成年
  S.princes.forEach(p=>{p.age++;if(p.son&&p.age>=16&&p.status==='幼年'){p.status='成年';log('皇子 '+p.nm+' 成年，可出仕封王。');}else if(!p.son&&p.age>=14&&p.status==='幼年'){p.status='成年';log('公主 '+p.nm+' 及笄，可联姻。');}});
  S.concubines.forEach(c=>{c.age=safe(c.age,16)+1;if(c.preg&&c.title!=='皇太后'){c.preg=false;birthChild(c);}}); // 第十三轮修复：嫔妃此前从不增龄（导致换代时无法按年龄处置先帝嫔妃）；皇太后不再诞育
  // 后宫：安定度回升 / 失火 / 争宠（每5载入）
  S.haremPeace=clamp(safe(S.haremPeace,100)+2,0,100);
  if(S.haremPeace<30&&S.year%3===0){S.heart=clamp(S.heart-5,0,S.heartCap);S.rep=Math.max(0,S.rep-10);log('⚠ 后宫失火，朝野侧目：民忠-5，声望-10。');eventBroadcast('民变','后宫失火','六宫不宁，流言四起，民忠-5、声望-10。');}
  if(S.year%5===0&&S.concubines.length>=3)concFavorEvent();
  // 名将好感事件链（招降名将恩义未固时，每载入可能生变）
  maybeStarFavor();
  // 民忠自然回升（国库非负、治安尚可时缓慢回血，避免赤字→民忠崩盘的死亡螺旋）
  if(S.gold>=0&&S.order>=45)S.heart=clamp(S.heart+1,0,S.heartCap);
  applyFoodBudget(); // 第十三轮：每载入结算粮食收支（产耗相抵，负值即饥荒）
  // 人口增长
  S.pop=Math.round(S.pop*(1+S.growth));
  // 国运缓慢衰减
  S.fate=clamp(S.fate-rf(0,1.5),0,100);
  // 动态难度：国力过强则外患加剧，过弱则赐机遇
  dynamicDifficulty();
  // 沙盘AI行动
  sandboxAI();
  // —— 平衡性优化：炼狱「大势已定」清场（400载入后占城≥15，最弱AI势力每载入40%归顺，缓慢破僵局而非自动发通关）——
  if(S.diff==='hell'&&S.year>=400){
    const myC=S.nodes.filter(n=>n.owner==='me').length;
    if(myC>=15){
      const facs=S.forces.filter(f=>f.ai&&f.relation['me']!=='藩'&&f.relation['me']!=='盟'&&S.nodes.some(n=>n.owner===f.id));
      if(facs.length&&Math.random()<0.3){
        const f=facs.sort((a,b)=>S.nodes.filter(n=>n.owner===a.id).length-S.nodes.filter(n=>n.owner===b.id).length)[0];
        S.nodes.forEach(n=>{if(n.owner===f.id){n.owner='me';n.troop=Math.round(n.troop*0.5);}});
        f.relation['me']='藩';S.rep+=3;log('🏮 大势已定，'+f.name+' 举国归顺！');toast('🏮 '+f.name+' 归顺');
      }
    }
  }
  // —— 平衡性优化：炼狱「天命」Buff（300载入后每载入攻城决胜胜率+5%，上限10层+50%，概率性破后期僵局，而非自动发通关）——
  if(S.diff==='hell'&&S.year>300){S.modsDestiny=(S.modsDestiny||0)+1;if(S.modsDestiny<=10){S.siegeBuff=(S.siegeBuff||0)+0.05;if(S.year%10===0)log('🔥 天命所归（第'+S.modsDestiny+'层）：攻城决胜 +'+(S.modsDestiny*5)+'%。');}}
  // 随机事件（图文播报）
  maybeEvent();
  // 年龄 / 驾崩
  if(S.age>S.deathAge && Math.random()<(S.age-50)/100){
    if(S.heir){inheritThrone();}else{gameOver();return;}
  }
  if(S.settings.autosave)saveGame();
  log('第'+S.year+'载入，国势 '+powerScore()+'，国库 '+Math.round(S.gold)+' 万两（行政开销 -'+upkeep+'）。');
  toast('▶ 第 '+S.year+' 载入');
  renderAll();
  if(S.defend&&!S.defend.done){renderDefend();} // 守城战优先弹窗（引导顺延）
  else maybeTutorial();
  if(checkVictory())return;
  if(S.gold<0)fiscalWarn();
}
function dynamicDifficulty(){
  const p=powerScore();
  if(p>3200){ // 第十三轮微调：门槛 2600→3200（军事流暴兵期常被触发，给玩家留出 20~40 载入的暴兵窗口，否则军事 2% 过于失真）
    S.aiK=DIFFS[S.diff].aiK*1.6;S.heart=clamp(S.heart-ri(0,3),0,S.heartCap);
  }else if(p<1000){ // 过弱：机遇
    S.aiK=DIFFS[S.diff].aiK*0.6;if(Math.random()<0.3){const g=ri(10,40);S.gold+=g;log('天赐机遇，得援银 '+fmt(g)+' 万两。');}
  }else{S.aiK=DIFFS[S.diff].aiK;}
}
function inheritThrone(){const p=S.princes.find(x=>x.isHeir);const old=S.era;S.era=p?p.nm:('新'+S.era);S.age=p?Math.max(18,p.age):20;S.heir=null;if(p)p.isHeir=false;S.gen=(S.gen||1)+1;const keep=Math.round(S.culture*0.7+S.tech*0.5);S.culture=Math.round(keep);S.heart=clamp(S.heart-5,0,S.heartCap);
  const hm=rotateHarem(); // 第十三轮修复：旧版换代只换年号，后宫人物纹丝不动（先帝皇后仍是皇后），不合礼制也无换代感
  log('⚰ 先帝崩，'+S.era+' 继位，新朝肇始（第 '+S.gen+' 代）。');
  log('👑 后宫更替：'+hm.msg);
  toast('👑 皇权更替：'+S.era+' 登基｜'+hm.msg);

/* 后宫洗牌：先帝皇后→皇太后（居慈宁宫、不再诞育）；年少嫔妃多遣散出宫；余者降为太妃、恩宠减半；新帝选秀纳新 */
function rotateHarem(){
  const oldq=S.concubines.find(c=>c.id===S.queen);
  S.queen=null;let retire=0,kept=0,newc=0;const keep=[];
  S.concubines.forEach(c=>{
    if(oldq&&c.id===oldq.id){c.title='皇太后';c.love=Math.round(safe(c.love,50)*0.6);c.preg=false;keep.push(c);kept++;return;}
    const a=safe(c.age,20);
    if(a<45&&Math.random()<0.65){retire++;return;} // 先帝年少嫔妃遣散出宫（归乡或入道观）
    if(c.title==='皇后'||c.title==='贵妃'||c.title==='妃')c.title='太妃';
    c.love=Math.round(safe(c.love,50)*0.5);c.preg=false;keep.push(c);kept++;
  });
  S.concubines=keep;
  const n=ri(2,3);for(let i=0;i<n;i++){const c=genConcubine();c.age=ri(15,19);c.title='贵人';S.concubines.push(c);newc++;} // 新帝选秀
  S.haremPeace=clamp(safe(S.haremPeace,100)-15,0,100); // 换代六宫不宁
  return {retire:retire,kept:kept,newc:newc,msg:(oldq?oldq.nm+' 尊为皇太后':'先帝无后')+'，遣散先帝嫔妃 '+retire+' 人、留 '+kept+' 人，新帝选秀 '+newc+' 人'};}

function wrapText(ctx,text,x,y,maxW,lh){const chars=String(text).split('');let line='',yy=y;for(const ch of chars){if(ctx.measureText(line+ch).width>maxW){ctx.fillText(line,x,yy);line=ch;yy+=lh;}else line+=ch;}if(line)ctx.fillText(line,x,yy);return yy;}

/* —— 经济多渠道 —— */
function taxMul(){return [0.8,1,1.15][S.taxes]||1;} // 低/中/高 税率对征收量的影响
function actTaxRate(){
  if(S.year-S.lastTaxRate<5){toast('税制调整每5载入限1次（还需 '+(5-(S.year-S.lastTaxRate))+' 载入）');return;}

function setTax(v){S.taxes=v;S.lastTaxRate=S.year;const d=['低(5%)','中(10%)','高(15%)'][v];log('下诏改行'+d+'。');toast('已设为'+d);closeModal();renderAll();}
function actTradeRoute(){

function doTradeRoute(fid){const k=econTight()?1.5:1;if(!canAfford(k))return;S.gold-=k;const f=S.forces.find(x=>x.id===fid);const me=S.officials.find(o=>o.type==='文')||{six:{智力:50,魅力:50}};const chance=0.5+(me.six.智力+me.six.魅力)/400;if(Math.random()<chance){const inc=econTight()===0?ri(2,10):econTight()===2?ri(1,4):ri(1,5);S.trades.push({fid:fid,income:inc});log('与'+f.name+'开通商路，岁入约'+inc+'万两。');report('商路开通',[['与',f.name],['岁入(万两)',inc],['国库',-k]]);toast('商路开通！');}else{report('商路未成',[['国库',-k]]);toast('商路谈判未果');}closeModal();renderAll();}

/* —— 后宫晋升（皇后唯一） —— */
function nextTitle(t){const ord=['秀女','贵人','嫔','妃','贵妃','皇后'];const i=ord.indexOf(t);return i<0?t:ord[Math.min(i+1,5)];}
function actPromoteConc(){
  const list=S.concubines.filter(c=>c.title!=='皇后'&&titleRank(c.title)<5);
  if(!list.length){toast('已无可晋升之嫔妃');return;}
  const k=2;if(!beginAct('promoteC',k))return;
  let h='<p>选择晋升嫔妃（消耗1行动点+国库'+fmt(k)+'万两；需「家世/才情/容貌」综合≥60 且 忠诚≥60）：</p>';
  list.forEach(c=>{const comp=(c.six.家世+c.six.才情+c.six.容貌)/3;const ok=comp>=60&&c.six.忠诚>=60;const rate=clamp(0.6+(S.rep/200)+(comp-60)/100,0.4,0.99);
    h+='<button class="btn" onclick="doPromoteConc(\''+c.id+'\','+k+')">'+c.nm+' '+c.title+'→'+nextTitle(c.title)+(ok?'':'（条件不足）')+'（成功率'+(rate*100).toFixed(0)+'%）</button><br>';});
  showModal('后宫·晋升',h);
}
function doPromoteConc(id,k){if(!canAfford(k))return;S.gold-=k;const c=S.concubines.find(x=>x.id===id);const comp=(c.six.家世+c.six.才情+c.six.容貌)/3;const rate=clamp(0.6+(S.rep/200)+(comp-60)/100,0.4,0.99);
  if(comp<60&&c.six.忠诚<60){report('条件不足',[['需','综合≥60且忠诚≥60']]);closeModal();renderAll();return;}
  if(Math.random()<rate){
    if(c.title==='贵妃'){ if(S.queen){const old=S.concubines.find(x=>x.id===S.queen);if(old)old.title='贵人';} S.queen=c.id;c.title='皇后';S.rep+=5; }
    else{const ord=['秀女','贵人','嫔','妃','贵妃','皇后'];const i=ord.indexOf(c.title);c.title=ord[Math.min(i+1,5)];}
    log(c.nm+' 晋为 '+c.title+'。');report('晋升成功',[['嫔妃',c.nm],['至',c.title]]);
  }else{c.six.忠诚=clamp(c.six.忠诚-10,1,100);report('晋升失败',[['损耗',k],['忠诚','-10']]);toast('晋升未成，嫔妃忠诚-10');}
  closeModal();renderAll();
}
function abolishConc(id){const c=S.concubines.find(x=>x.id===id);if(!c)return;if(c.title==='皇后')S.queen=null;S.concubines=S.concubines.filter(x=>x.id!==id);toast('已废黜 '+c.nm);renderAll();}
function concFavorEvent(){
  if(S.concubines.length<3)return;
  if(Math.random()<0.5){const pool=S.concubines.slice();const a=pick(pool);const b=pick(pool.filter(x=>x.id!==a.id));
    let h='<p>后宫生隙：<b>'+a.nm+'</b> 与 <b>'+b.nm+'</b> 争宠。</p><p>如何应对？</p>';
    h+='<button class="btn gold" onclick="favorChoice(\'安抚\',\''+a.id+'\',\''+b.id+'\')">雨露均沾（安抚）</button> ';

function favorChoice(act,a,b){const A=S.concubines.find(x=>x.id===a),B=S.concubines.find(x=>x.id===b);
  if(act==='安抚'){if(A)A.six.忠诚=clamp(A.six.忠诚+3,1,100);if(B)B.six.忠诚=clamp(B.six.忠诚+3,1,100);S.haremPeace=clamp(S.haremPeace+5,0,100);toast('雨露均沾，后宫稍安');}
  else if(act==='冷'){if(A)A.six.忠诚=clamp(A.six.忠诚-3,1,100);if(B)B.six.忠诚=clamp(B.six.忠诚-3,1,100);S.haremPeace=clamp(S.haremPeace-5,0,100);toast('冷处理，后宫安定-5');}
  else{if(A){if(S.queen===a)S.queen=null;S.concubines=S.concubines.filter(x=>x.id!==a);}S.haremPeace=clamp(S.haremPeace+10,0,100);S.rep-=3;toast('废黜 '+A.nm+'，立威但声望-3');}

/* —— 子嗣培养 —— */
function ksAdd(p,a,b){['统率','武力','智力','政治','魅力'].forEach(k=>p.six[k]=clamp(p.six[k]+ri(a,b),1,100));}
function cultivateChild(id,type){
  const p=S.princes.find(x=>x.id===id);if(!p)return;
  if(p.age<10){toast('尚在幼年，需满10岁方可培养');return;}
  if((p.cultCount||0)>=2){toast('本载入已培养2次（每子每载入限2次）');return;}
  const k=type==='师'?1:(type==='历练'?0.5:0.2);
  if(!beginAct('cult_'+id,k))return;
  S.gold-=k;p.cultCount=(p.cultCount||0)+1;
  const bonus=((p.talent==='文'&&type==='文')||(p.talent==='武'&&type==='武')||(p.talent==='政'&&type==='政'))?1.3:1;
  const g=z=>Math.round(z*bonus);
  if(type==='文'){const a=g(ri(3,8)),b2=g(ri(2,5));p.six.智力=clamp(p.six.智力+a,1,100);p.six.政治=clamp(p.six.政治+b2,1,100);report('习文',[['智力','+'+a],['政治','+'+b2]]);}
  else if(type==='武'){const a=g(ri(3,8)),b2=g(ri(2,5));p.six.统率=clamp(p.six.统率+a,1,100);p.six.武力=clamp(p.six.武力+b2,1,100);report('习武',[['统率','+'+a],['武力','+'+b2]]);}
  else if(type==='政'){const a=g(ri(3,8)),b2=g(ri(2,5));p.six.政治=clamp(p.six.政治+a,1,100);p.six.智力=clamp(p.six.智力+b2,1,100);report('习政',[['政治','+'+a],['智力','+'+b2]]);}
  else if(type==='师'){ksAdd(p,10,20);if(!p.trs)p.trs=[];const tr=pick(OFF_TRAITS).nm;if(!p.trs.includes(tr))p.trs.push(tr);report('请名师',[['全属性','+10~20'],['得词条',tr]]);}
  else if(type==='历练'){ksAdd(p,5,15);report('历练',[['全属性','+5~15']]);}
  renderAll();
}
function princeAdult(id){const p=S.princes.find(x=>x.id===id);if(!p)return;
  if(p.son&&p.age>=16){let h='<p>皇子 '+p.nm+' 已成年（'+p.age+'岁），可：</p><button class="btn gold" onclick="princeAction(\''+id+'\',\'王\')">封王（1点+1万）</button> <button class="btn" onclick="princeAction(\''+id+'\',\'帅\')">任统帅（1点）</button> <button class="btn" onclick="makeHeir(\''+id+'\')">立为太子</button>';showModal('皇子·出仕',h);}
  else if(!p.son&&p.age>=14){let h='<p>公主 '+p.nm+' 已成年（'+p.age+'岁），可：</p><button class="btn gold" onclick="princeAction(\''+id+'\',\'姻\')">联姻（外交+进贡）</button> <button class="btn" onclick="princeAction(\''+id+'\',\'长\')">封长公主（礼部+10%）</button>';showModal('公主·出阁',h);}

function drawAvatar(o){const cv=document.createElement('canvas');cv.width=120;cv.height=150;const ctx=cv.getContext('2d');const rc={橙:'#ff9d2e',紫:'#b06bff',蓝:'#4aa3ff',绿:'#5fbf7a'}[o.rarity]||'#888';ctx.fillStyle='#1a1426';ctx.fillRect(0,0,120,150);ctx.strokeStyle=rc;ctx.lineWidth=2;ctx.strokeRect(4,4,112,142);const sk=o.type==='文'?'#e8c9a0':'#d8b48a';ctx.fillStyle=sk;ctx.beginPath();ctx.arc(60,58,26,0,7);ctx.fill();ctx.fillRect(34,84,52,50);ctx.fillStyle=rc;ctx.fillRect(34,84,52,10);ctx.fillStyle='#2a2030';ctx.fillRect(50,94,20,30);return cv.toDataURL();}
function drawRadar(ctx,dim){const ks=Object.keys(dim);const n=ks.length;const cx=120,cy=120,R=90;ctx.fillStyle='#0d0d12';ctx.beginPath();ctx.arc(cx,cy,R+10,0,7);ctx.fill();ctx.strokeStyle='#3a3320';for(let r=1;r<=4;r++){ctx.beginPath();for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;const x=cx+Math.cos(a)*R*r/4,y=cy+Math.sin(a)*R*r/4;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();ctx.stroke();}ctx.strokeStyle='#d4af37';ctx.beginPath();for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;const v=dim[ks[i]]/100;const x=cx+Math.cos(a)*R*v,y=cy+Math.sin(a)*R*v;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();ctx.fillStyle='rgba(212,175,55,.35)';ctx.fill();ctx.stroke();ctx.fillStyle='#e8e2d0';ctx.font='12px sans-serif';for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;ctx.fillText(ks[i],cx+Math.cos(a)*(R+18)-10,cy+Math.sin(a)*(R+18)+4);}}

function renderSiege(){

  {const _co={'强攻':1.0,'围城':0.6,'离间':0.8}[sg.strat]||1;let _wr=clamp(sg.committed/(sg.committed+Math.max(1,sg.enemyTroop))*0.78+siegeGenLead()/(siegeGenLead()+sg.enemyLead)*0.17+_co*0.05,0.05,0.97);if(sg.committed/Math.max(1,sg.enemyTroop)>=3)_wr=clamp(Math.max(_wr,0.90),0.05,0.97);const _c=_wr>=0.66?'var(--good)':_wr>=0.4?'var(--warn)':'var(--bad)';h+='<p class="muted">预计总攻胜率：<b style="color:'+_c+'">'+Math.round(_wr*100)+'%</b>'+(sg.committed/Math.max(1,sg.enemyTroop)>=3?'（兵力碾压）':'')+'</p>';} // 平衡性优化：出征前透明显示胜率，消除"为何打不过"的认知错位

function siegeStep(){const sg=S.siege;if(!sg||sg.progress>=100)return;if(!spendAP())return;sg.turn++;
  const lead=siegeGenLead();const coeff={'强攻':1.0,'围城':0.6,'离间':0.8}[sg.strat]||1;
  let adv=(8+lead/16)*coeff*rf(0.85,1.2); // 第十二轮回调：单步推进 (12+lead/12)→(8+lead/16)，攻城不再秒推，决策更吃兵力与器械
  const _ratio=sg.committed/Math.max(1,sg.enemyTroop); // 第十三轮修复：推进速度与"兵力对比"连续挂钩（旧版仅≥4倍×1.35，导致2000打100与200打100同速，玩家体感"人多也打不下来"）
  const _rk=_ratio>=10?2.6:_ratio>=5?2.0:_ratio>=3?1.6:_ratio>=2?1.3:_ratio>=1?1.05:_ratio>=0.6?0.8:0.55; // 连续倍率：优势越大推得越快，劣势则明显吃力
  adv*=_rk;
  if(_ratio>=10)adv+=14;      // 绝对碾压（≥10倍）：蚁附登城，2~3回合破城，消除"以多打少还磨蹭"的挫败
  else if(_ratio>=5)adv+=6;   // 大优（≥5倍）：明显提速
  // 名将死忠（好感≥80）：身先士卒，推进更快
  {const g2=sg.gen?S.officials.find(o=>o.id===sg.gen):null;if(g2&&g2.isStar&&safe(g2.fav,50)>=80)adv+=1.5;}
  // 阵前倒戈：好感极低的招降名将可能临阵叛变（30%）
  {const g3=sg.gen?S.officials.find(o=>o.id===sg.gen):null;
   if(g3&&g3.isStar&&safe(g3.fav,50)<30&&Math.random()<0.3){
     const take=Math.round(sg.committed*0.3);sg.committed=Math.max(1000,sg.committed-take);sg.enemyTroop+=take;sg.progress=clamp(sg.progress-15,0,100);
     const dfd=S.forces.find(f=>f.id===S.nodes.find(n=>n.id===sg.to).owner);
     const tgt=S.nodes.find(n=>n.id===sg.to);
     S.starGens.push({id:'sgd_'+g3.id,nm:g3.nm,lead:clamp(safe(g3.six.统率,60),60,100),might:clamp(safe(g3.six.武力,60),60,100),wit:clamp(safe(g3.six.智力,50),50,100),force:(dfd?dfd.id:'neutral'),city:tgt.id,loyal:ri(75,95),trs:g3.trs||[]});
     S.officials=S.officials.filter(x=>x.id!==g3.id);
     if(S.garrison)Object.keys(S.garrison).forEach(k=>{if(S.garrison[k]===g3.id)delete S.garrison[k];});
     sg.log.unshift('🚩 第'+sg.turn+'回合：'+g3.nm+' 阵前倒戈！携'+fmt(take)+'兵投敌，反戈一击（进度-15%）');
     log('🚩 招降名将 '+g3.nm+' 恩义不固，阵前倒戈投'+(dfd?dfd.name:'敌')+'！');toast('🚩 '+g3.nm+' 倒戈！');
     eventBroadcast('叛变','名将倒戈','招降名将 '+g3.nm+' 因恩义未结，阵前倒戈，携军投敌！日后招降名将，须以恩义抚之（好感<30 极易生变）。');
   }}
  if(S.engines.tower&&sg.strat==='围城')adv+=2.5; // 楼车：围城推进加速
  if(S.engines.ram)adv+=1.5; // 冲车：破墙推进

  let pending=false;

  if(pending)return; // 决策弹窗挂起（围点打援/单挑），待玩家抉择后自行 renderSiege
  if(!pending&&S.engines.ram&&Math.random()<0.2){sg.progress=clamp(sg.progress+15,0,100);sg.log.unshift('🐏 第'+sg.turn+'回合：冲车撞塌城墙一角！进度+15%');}
  if(sg.strat==='离间'&&S.engines.well&&Math.random()<0.15){sg.progress=100;sg.log.unshift('🪜 第'+sg.turn+'回合：井栏高台喊话，城中守将开城来降！');}

}
function siegeEvent(){const sg=S.siege;
  const sgen=starAt(sg.to);
  if(sgen&&Math.random()<0.32)return starGenEvent(sgen); // 名将专属剧情事件
  const evs=[
  ()=>{const l=Math.round(sg.committed*0.1);sg.committed=Math.max(1000,sg.committed-l);sg.progress=clamp(sg.progress+10,0,100);sg.log.unshift('第'+sg.turn+'回合：守将出城偷袭！损失兵力'+fmt(l)+'，进度+10%');return false;},

  ()=>{sg.enemyTroop=Math.max(0,Math.round(sg.enemyTroop*0.8));sg.progress=clamp(sg.progress+15,0,100);sg.log.unshift('第'+sg.turn+'回合：城内哗变！守军-20%，进度+15%');return false;},

  ];const fn=pick(evs);return fn();}
function siegeDecisive(){const sg=S.siege;if(!sg)return;const from=S.nodes.find(n=>n.id===sg.from),to=S.nodes.find(n=>n.id===sg.to);
  const lead=siegeGenLead();const myT=Math.max(1,sg.committed),enT=Math.max(1,sg.enemyTroop);const coeff={'强攻':1.0,'围城':0.6,'离间':0.8}[sg.strat]||1;
  let winRate=clamp(myT/(myT+enT)*0.62+lead/(lead+sg.enemyLead)*0.20+coeff*0.04,0.05,0.92); // 第十二轮回调：兵力胜率权重 0.78→0.62（恢复"以少胜多"可能，避免碾压无脑），上限 0.97→0.92
  if(myT/enT>=4)winRate=clamp(Math.max(winRate,0.80),0.05,0.92); // 第十二轮回调：碾压锁定 ≥3倍@0.90 → ≥4倍@0.80（仅绝对兵力优势才稳赢，普通难度不再轻易通关）
  if(myT/enT>=10)winRate=clamp(Math.max(winRate,0.96),0.05,0.97); // 第十三轮修复：绝对碾压（≥10倍）锁定必克，避免"2000打100还翻车"的荒诞感
  if(S.engines.treb)winRate=clamp(winRate+0.06,0.05,0.95); // 投石机：总攻胜率+6%
  if(S.engines.well&&sg.strat==='离间')winRate=clamp(winRate+0.10,0.05,0.95); // 井栏：离间加成
  if(starAt(sg.to))winRate=clamp(winRate-0.08,0.05,0.95); // 名将坐镇：胜率-8%
  {const g4=sg.gen?S.officials.find(o=>o.id===sg.gen):null;if(g4&&g4.isStar&&safe(g4.fav,50)>=80)winRate=clamp(winRate+0.04,0.05,0.95);} // 死忠名将：总攻胜率+4%
  if(S.siegeBuff)winRate=clamp(winRate+S.siegeBuff,0.05,0.95); // 平衡性优化：炼狱天命Buff直接加成攻城决胜胜率（破后期僵局）
  const prevF=S.forces.find(f=>f.id===to.owner);
  if(Math.random()<winRate){
    const keepRate=S.engines.treb?0.62:0.5; // 投石机：强攻压城，留存兵力更多
    from.troop=Math.max(0,safe(from.troop,0)-sg.committed);S.armies.me=Math.max(0,safe(S.armies.me,0)-sg.committed);
    to.owner='me';to.troop=Math.round(sg.committed*keepRate);to.def=Math.max(0,safe(to.def,10)-ri(0,10));S.rep+=2;
    afterCityFall(to,true); // 名将突围/被俘
    log('攻克 '+to.name+'！（决战胜）');toast('⚔ 攻克 '+to.name);
    if(to.id==='taiwan'||to.id==='diaoyu'){S.rep+=30;log('🌊 海疆定鼎：收复'+to.name+'，声望+30！');eventBroadcast('战事','海疆定鼎','收复'+to.name+'！四海震动，声望+30。');}
    // 附属国：敌国尚存多城且我方声望高，有概率称藩进贡
    if(prevF&&prevF.ai&&to.id!==prevF.id){const left=S.nodes.filter(x=>x.owner===prevF.id).length;
      if(left>=3&&S.rep>=50&&Math.random()<0.35&&prevF.relation['me']!=='敌'){prevF.relation['me']='藩';log('🏮 '+prevF.name+' 慑于天威，遣使称藩（每载入进贡）。');toast('🏮 '+prevF.name+' 称藩进贡');}}
    // 扩张太快 → 诸侯结盟围攻
    if(S.nodes.filter(n=>n.owner==='me').length>=10){let hostile=0;S.forces.forEach(f=>{if(f.ai&&f.relation['me']!=='盟'&&f.relation['me']!=='藩'&&Math.random()<0.5){f.relation['me']='敌';hostile++;}});if(hostile)log('⚠ 扩张太急，'+hostile+' 国暗结同盟，共谋制我！');}
    _lastCaptured=to;S.siege=null;siegeAftermath(to);
  }else{
    const loss=Math.round(sg.committed*(sg.strat==='围城'?0.5:0.8));
    from.troop=Math.max(0,from.troop-loss);S.armies.me=Math.max(0,S.armies.me-loss);sg.enemyTroop=Math.max(0,Math.round(sg.enemyTroop*0.9));
    S.rep=Math.max(0,S.rep-10);S.heart=clamp(S.heart-3,0,S.heartCap);
    log('攻 '+to.name+' 决战失利，损兵 '+fmt(loss)+'。');toast('⚔ 决战失利，损兵 '+fmt(loss));S.siege=null;renderAll();
  }
}
let _lastCaptured=null;

  h+='<button class="btn" onclick="aftermath(\'怀柔\')">怀柔安抚（民忠+10·声望+5·耗2万）</button>';

  h+='<button class="btn gold" onclick="aftermath(\'掠夺\')">⚔掠夺（夺财2~8万·民忠-10·声望-5）</button></div>';  // 平衡性优化：以战养战·掠夺入口

function aftermath(act){const tn=_lastCaptured;if(!tn){closeModal();renderAll();return;}
  if(act==='怀柔'){S.gold=Math.max(TREASURY_FLOOR,S.gold-2);S.heart=clamp(S.heart+10,0,S.heartCap);S.rep+=5;log('怀柔安抚 '+tn.name+'，民稍安。');}
  else if(act==='严管'){S.order=clamp(S.order+10,0,100);S.heart=clamp(S.heart-5,0,S.heartCap);S.mods.income=(S.mods.income||0)+0.2;log('严加管束 '+tn.name+'，收入+20%。');}
  else if(act==='屠城'){S.rep+=15;S.heart=clamp(S.heart-15,0,S.heartCap);S.gold+=ri(5,15);log('屠城威慑 '+tn.name+'，缴获颇丰，然民怨沸腾。');}
  else if(act==='掠夺'){const loot=(S.diff==='hell'?ri(1,3)+Math.round(tn.def/40):S.diff==='normal'?ri(1,4)+Math.round(tn.def/30):ri(2,8)+Math.round(tn.def/20));S.gold+=loot;S.heart=clamp(S.heart-10,0,S.heartCap);S.rep=Math.max(0,S.rep-5);log('掠夺 '+tn.name+'，获 '+loot+' 万两，然民怨声望俱损。');}  // 平衡性优化：普通模式掠夺 2~8万→1~5万(-30%)，以战养战仍可行但不能单靠掠夺养全军
  else if(act==='招降'){
    if(S._capturedStar){const st=S._capturedStar;S._capturedStar=null;
      const me=S.officials.find(o=>o.type==='文')||{six:{魅力:50,智力:50}};
      if(Math.random()<0.35+((me.six.魅力||50)+(me.six.智力||50))/400+(S.rep>=60?0.1:0)){
        const o=genOfficial('武');o.nm=st.nm;o.rarity=st.lead>=90?'橙':'紫';
        o.six.统率=clamp(st.lead+ri(0,5),1,100);o.six.武力=clamp(st.might,1,100);o.six.智力=clamp(st.wit,1,100);o.six.忠诚=ri(50,70);
        o.trs=(st.trs&&st.trs.length?st.trs:[pick(OFF_TRAITS).nm]).slice(0,3);
        o.isStar=1;o.fav=55;o.homeForce=st.force; // 名将好感链：招降而来，恩义未固
        S.officials.push(o);S.rep+=3;
        log('🎖 招降守城名将 '+st.nm+' 归顺！（统率'+o.six.统率+'·声望+3）');toast('🎖 名将 '+st.nm+' 归顺！');eventBroadcast('人才','名将归顺','守城名将 '+st.nm+' 慑于天威，俯首来归。统率 '+o.six.统率+'，可堪大用。');
      }else{log('🎖 名将 '+st.nm+' 宁死不降，慨然赴死。海内闻之，士林叹惋。');S.heart=clamp(S.heart-2,0,S.heartCap);toast(st.nm+' 拒降而死');}
    }else{const me=S.officials.find(o=>o.type==='武')||{six:{魅力:50,智力:50}};if(Math.random()<0.5+(me.six.魅力+me.six.智力)/400){const o=genOfficial('武');S.officials.push(o);log('招降敌将 '+o.nm+' 来归。');toast('招降成功：'+o.nm);}else toast('招降未果');}
  }
  _lastCaptured=null;closeModal();renderAll();
}
function abandonSiege(){if(S.siege){S.siege=null;toast('已撤军');}closeModal();renderAll();}

/* —— 攻城器械科技树（投石机/冲车/楼车/井栏，督造解锁，永久生效） —— */
const ENGINES=[
  {id:'treb',nm:'投石机',icon:'🪨',desc:'总攻胜率+6%，攻克后留存兵力 50%→62%',cost:8,turns:3},
  {id:'ram',nm:'冲车',icon:'🐏',desc:'每回合推进+1.5%，20%概率撞塌城墙（进度+15%）',cost:6,turns:2},
  {id:'tower',nm:'楼车',icon:'🗼',desc:'围城推进+2.5%/回合，粮道被断风险减半',cost:6,turns:2},
  {id:'well',nm:'井栏',icon:'🪜',desc:'离间总攻胜率+10%，15%概率每回合直接劝降',cost:7,turns:3}
];
function actEngine(){
  let h='<p class="muted">督造攻城器械：每次督造消耗 1 行动点 + 国库（每载入限 1 次），需多次督造方可落成，落成后永久生效。</p><div class="row" style="flex-wrap:wrap">';
  ENGINES.forEach(e=>{const got=S.engines[e.id];const cur=(S.engRes&&S.engRes.id===e.id);
    h+='<div class="card3" style="flex:1;min-width:220px"><p class="h">'+e.icon+' '+e.nm+(got?' <span class="gold2">✅已装备</span>':'')+'</p>';
    h+='<p class="muted" style="font-size:12px">'+e.desc+'</p>';
    h+='<p class="muted" style="font-size:12px">造价 '+e.cost+' 万两/次 · 共需 '+e.turns+' 次督造</p>';
    if(cur){const _pg=clamp(safe(S.engRes.prog,0),0,100);const _step=Math.ceil(100/e.turns); // 第十三轮修复：可视进度条（旧版仅一行文字，且督造后直接关窗，玩家以为进度没变）
      h+='<div style="background:#0006;border:1px solid var(--line);border-radius:5px;height:14px;overflow:hidden;margin:4px 0"><div style="height:100%;width:'+_pg+'%;background:linear-gradient(90deg,#e85d4a,#d4af37);transition:.3s"></div></div>';
      h+='<p class="gold2" style="font-size:12px">督造进度 '+Math.round(_pg)+'%（第 '+Math.min(e.turns,Math.ceil(_pg/_step))+'/'+e.turns+' 次，每载入限督造1次）</p>';}
    h+=(got||cur)?'':'<button class="btn sm" onclick="doEngine(\''+e.id+'\')">开始/继续督造</button>';
    h+='</div>';});
  h+='</div>';
  showModal('🛠 攻城器械·督造',h);}
function doEngine(id){const e=ENGINES.find(x=>x.id===id);if(!e)return;
  if(S.engines[id]){toast(e.nm+' 已装备');return;}
  if(!S.engRes)S.engRes={id:id,prog:0};
  if(S.engRes.id!==id){const cur=ENGINES.find(x=>x.id===S.engRes.id);toast('先完成当前「'+(cur?cur.nm:'?')+'」的督造（进度'+Math.round(S.engRes.prog)+'%）');return;}
  if(!beginAct('engine',e.cost))return;S.gold-=e.cost;
  S.engRes.prog=clamp(safe(S.engRes.prog,0)+Math.ceil(100/e.turns),0,100);
  if(S.engRes.prog>=100){S.engines[id]=1;S.engRes=null;
    log('🛠 '+e.nm+' 督造完成！'+e.desc);
    report('工部·器械落成',[['获得',e.nm],['效果',e.desc]]);
    eventBroadcast('工造',e.nm+'落成',e.icon+' 攻城器械「'+e.nm+'」督造完成：'+e.desc);
  }else{report('工部·督造'+e.nm,[['进度',S.engRes.prog+'%'],['国库(万两)',-e.cost]]);
    toast('🔨 '+e.nm+' 督造中 '+Math.round(S.engRes.prog)+'%（还需 '+Math.ceil((100-S.engRes.prog)/Math.ceil(100/e.turns))+' 次）');}
  closeModal();renderAll();actEngine(); // 第十三轮修复：督造后立刻重开面板，让玩家看到进度条确实在推进（旧版直接关窗，体感"进度一直没变"）
}

/* —— 守城名将系统 —— */
function starAt(cityId){return (S.starGens||[]).find(x=>x.city===cityId)||null;}
function starGenEvent(star){const sg=S.siege;if(!sg)return false;const r=Math.random();
  if(r<0.45){ // 名将突围
    const l=Math.round(sg.committed*0.15);sg.committed=Math.max(1000,sg.committed-l);sg.progress=clamp(sg.progress-8,0,100);
    sg.log.unshift('🎖 第'+sg.turn+'回合：名将 '+star.nm+' 亲率死士突围！我军损兵'+fmt(l)+'，进度-8%');return false;}
  if(r<0.7){ // 阵前单挑抉择
    const my=sg.gen?S.officials.find(o=>o.id===sg.gen):null;
    const myC=my?safe(my.six.统率,40)+safe(my.six.武力,40):80;
    let h='<p>守城名将 <b style="color:#ff6b5a">'+star.nm+'</b>（统率'+star.lead+'·武力'+star.might+'·词条'+star.trs.join('/')+'）阵前搦战，扬言一战定胜负！</p>';
    h+='<p class="muted">我方'+(my?('主将 '+my.nm+'，战力约 '+myC):'（无将出征·战力80）')+'。单挑胜则敌军夺气（进度+18%），败则损兵挫锐。</p>';
    h+='<div class="row"><button class="btn gold" onclick="duelStar('+myC+')">⚔ 应战单挑</button><button class="btn" onclick="declineDuel()">避战守营（进度-4%）</button></div>';
    S._duelStar=star;showModal('⚔ 阵前单挑·'+star.nm,h);return true;}
  // 坚壁清野
  sg.progress=clamp(sg.progress-6,0,100);sg.enemyTroop=Math.max(0,Math.round(sg.enemyTroop*1.05));
  sg.log.unshift('🎖 第'+sg.turn+'回合：'+star.nm+' 坚壁清野，攻势受挫（进度-6%）');return false;}
function duelStar(myC){const star=S._duelStar;S._duelStar=null;const sg=S.siege;
  if(!star||!sg){closeModal();renderSiege();return;}
  const my=safe(myC,80),his=star.lead+star.might;
  if(Math.random()*(my+his)<my){
    sg.progress=clamp(sg.progress+18,0,100);sg.enemyTroop=Math.max(0,Math.round(sg.enemyTroop*0.85));S.rep+=2;
    sg.log.unshift('⚔ 第'+sg.turn+'回合：阵前奏凯！单挑挫败 '+star.nm+'，敌军夺气（进度+18%，声望+2）');
  }else{
    const l=Math.round(sg.committed*0.1);sg.committed=Math.max(1000,sg.committed-l);sg.progress=clamp(sg.progress-5,0,100);
    sg.log.unshift('⚔ 第'+sg.turn+'回合：单挑失利！'+star.nm+' 威震三军（损兵'+fmt(l)+'，进度-5%）');
  }
  closeModal();renderSiege();}
function declineDuel(){const star=S._duelStar;S._duelStar=null;const sg=S.siege;
  if(sg){sg.progress=clamp(sg.progress-4,0,100);sg.log.unshift('🛡 第'+sg.turn+'回合：避战不出'+(star?'，'+star.nm+' 于城头大笑':'')+'（进度-4%）');}
  closeModal();renderSiege();}
// 城池易主后：守方名将突围转进本国余城；若国灭则被俘（仅我方攻克时）
function afterCityFall(city,captorIsMe){if(!city)return;const arr=S.starGens||[];const i=arr.findIndex(x=>x.city===city.id);if(i<0)return;
  const star=arr[i];const left=S.nodes.filter(n=>n.owner===star.force&&n.id!==city.id);
  if(left.length){const nc=left.slice().sort((a,b)=>safe(b.def,10)-safe(a.def,10))[0];star.city=nc.id;nc.def=safe(nc.def,10)+Math.floor(star.lead/6);nc.troop=safe(nc.troop,0)+1500;
    if(captorIsMe)log('🎖 名将 '+star.nm+' 突围，转进 '+nc.name+'，继续抗我。');return;}
  arr.splice(i,1);
  if(captorIsMe){S._capturedStar=star;log('🎖 守城名将 '+star.nm+' 被俘！可于战后处置中招降。');}}

/* —— 名将好感/叛逃事件链 —— */
function starGensOfMine(){return S.officials.filter(o=>o.isStar);}
function maybeStarFavor(){
  const stars=starGensOfMine();if(!stars.length)return;
  // 好感自然漂移：任职/驻防者渐安，闲置者渐冷，忠诚低者生怨
  stars.forEach(o=>{
    const posted=Object.values(S.posts).includes(o.id)||Object.values(S.garrison||{}).includes(o.id);
    let d=posted?1:-2;if(safe(o.six.忠诚,60)<40)d-=3;o.fav=clamp(safe(o.fav,50)+d,0,100);
  });
  // 好感极低 → 叛逃/辞官（旧主尚在则投旧主，敌国尚在则投敌，皆无则归隐）
  stars.forEach(o=>{
    if(safe(o.fav,50)<=20){
      const home=o.homeForce&&S.forces.find(f=>f.id===o.homeForce&&S.nodes.some(n=>n.owner===f.id));
      const hostile=home||S.forces.find(f=>f.ai&&f.relation['me']==='敌'&&S.nodes.some(n=>n.owner===f.id));
      removeStarOfficial(o);
      if(hostile){
        const cs=S.nodes.filter(n=>n.owner===hostile.id);
        const c=cs.length?pick(cs):null;
        if(c){S.starGens.push({id:'sgx_'+o.id,nm:o.nm,lead:clamp(safe(o.six.统率,70),60,100),might:clamp(safe(o.six.武力,70),60,100),wit:clamp(safe(o.six.智力,50),50,100),force:hostile.id,city:c.id,loyal:ri(80,98),trs:o.trs||[]});
          log('🚩 名将 '+o.nm+' 不堪冷遇，连夜出逃，投'+hostile.name+'！');toast('🚩 '+o.nm+' 叛逃！');
          eventBroadcast('叛变','名将叛逃','名将 '+o.nm+' 因久无恩赏、心灰意冷，连夜出逃投'+hostile.name+'，现为敌国守城名将！招降名将须常用「安抚」维系恩义。');return;}
      }
      log('🎖 名将 '+o.nm+' 心灰意冷，辞官归隐，飘然而去。');toast('🎖 '+o.nm+' 辞官而去');
    }
  });
  // 好感偏低 → 触发安抚抉择事件（每载入至多一名，取好感最低者）
  const low=starGensOfMine().filter(o=>safe(o.fav,50)<55).sort((a,b)=>safe(a.fav,50)-safe(b.fav,50))[0];
  if(low&&Math.random()<0.5)showStarEvent(low);
}
function removeStarOfficial(o){
  S.officials=S.officials.filter(x=>x.id!==o.id);
  Object.keys(S.posts).forEach(k=>{if(S.posts[k]===o.id)S.posts[k]=null;});
  if(S.garrison)Object.keys(S.garrison).forEach(k=>{if(S.garrison[k]===o.id)delete S.garrison[k];});
}

function starFavorChoice(id,choice){const o=S.officials.find(x=>x.id===id);if(!o){closeModal();renderAll();return;}

function defendTurn(){const d=S.defend;if(!d){toast('当前没有进行中的守城战');return;}
  if(d.progress>=100){toast('⚠ 敌军已蚁附登城（进度100%），请选择「出城迎击」或「弃城突围」');renderDefend();return;} // 第十三轮修复：旧版静默 return，玩家"点了没反应"
  if(!spendAP()){toast('行动点不足：可改用「🛡 闭城死守」（0行动点）拖住敌军');return;}d.turn++;
  const city=S.nodes.find(n=>n.id===d.city);const lead=defendLead();
  const stratK={'固守':0.75,'坚壁':0.6,'死守':0.9}[d.strat]||0.75;
  let adv=(7+d.enemyLead/16)*stratK*(1-Math.min(0.5,d.cityDef/200))*rf(0.8,1.2);
  if(d.enemyTroop<d.garrisonTroop*0.6)adv*=0.8; // 敌弱则攻势放缓

  if(d.strat==='坚壁'){S.heart=clamp(S.heart-1,0,S.heartCap);if(Math.random()<0.12){d.enemyTroop=Math.max(0,Math.round(d.enemyTroop*0.92));d.log.unshift('🌾 第'+d.turn+'回合：坚壁清野，敌军就食无所（敌兵-8%）');}}
  d.cityDef=Math.max(0,d.cityDef-ri(0,2));

function defendSortie(){const d=S.defend;if(!d)return;if(!spendAP())return;d.turn++;

function defendFlee(){const d=S.defend;if(!d)return;

  if(win){
    city.troop=d.garrisonTroop;city.def=Math.max(0,Math.round(d.cityDef));
    S.armies.me=Math.max(0,S.armies.me-d.initTroop+city.troop);
    S.rep+=2;S.heart=clamp(S.heart+3,0,S.heartCap);
    log('🛡 守住 '+city.name+'！'+(f.name||'敌军')+' '+why+'（声望+2·民忠+3）');toast('🛡 守城大捷：'+city.name);
    eventBroadcast('战事','守城大捷','我军坚守 '+city.name+'，'+(f.name||'敌军')+' '+why+'！缴获颇丰，声望+2。');
  }else{
    city.owner=d.attacker;city.troop=Math.round(d.enemyTroop*0.55);city.def=Math.max(0,Math.round(d.cityDef*0.6));
    S.armies.me=Math.max(0,S.armies.me-d.initTroop);
    S.heart=clamp(S.heart-8,0,S.heartCap);S.rep=Math.max(0,S.rep-8);
    if(S.garrison)delete S.garrison[city.id];
    log('💥 '+city.name+' 陷落！'+(f.name||'敌军')+'入城，守军尽没。');toast('💥 '+city.name+' 陷落');
  }
  S.defend=null;closeModal();
  if(!win)checkAllCitiesLost();
  renderAll();
}

function openCityManage(){let h='<p class="muted">城池兵力管理：可加强驻防、转移兵力、任命守将。</p><div class="row" style="flex-wrap:wrap">';

function reinforceCity(id){const n=S.nodes.find(x=>x.id===id);if(!n)return;const k=cost(ri(3,8));if(!beginAct('g_'+id,k))return;S.gold-=k;const dv=ri(5,15),tv=ri(300,900);n.def+=dv;n.troop+=tv;report('驻防加强·'+n.name,[['防御','+'+dv],['驻军','+'+tv]]);closeModal();renderAll();}
function openTransfer(id){const n=S.nodes.find(x=>x.id===id);if(!n)return;if(S.nodes.filter(m=>m.owner==='me'&&m.id!==id).length===0){toast('无其他己方城池可转移');return;}
  let h='<p>从 <b>'+n.name+'</b>（兵'+fmt(n.troop)+'）转移兵力至：</p><select id="tr_to">';
  S.nodes.filter(m=>m.owner==='me'&&m.id!==id).forEach(m=>{h+='<option value="'+m.id+'">'+m.name+'（兵'+fmt(m.troop)+'）</option>';});
  h+='</select><p>数量（上限该城70%，且转出后≥500）：<input id="tr_amt" type="number" value="'+Math.floor(n.troop*0.5)+'" style="width:120px"></p><button class="btn gold" onclick="doTransfer(\''+id+'\')">确认转移</button>';

function doTransfer(id){const n=S.nodes.find(x=>x.id===id);const tid=document.getElementById('tr_to').value;const t=S.nodes.find(x=>x.id===tid);const amt=Math.floor(Number(document.getElementById('tr_amt').value)||0);const max=Math.floor(n.troop*0.7);
  if(amt<100||amt>max||n.troop-amt<500){toast('数量不合法（需100~'+max+'，且转出后≥500）');return;}if(!spendAP())return;n.troop-=amt;t.troop+=amt;report('兵力转移',[['自',n.name],['至',t.name],['兵力','+'+amt]]);closeModal();renderAll();}
function openGarrison(id){const n=S.nodes.find(x=>x.id===id);if(!n)return;const gens=S.officials.filter(o=>o.type==='武');
  // 第十三轮修复：一人只能守一城——已驻他城的将领不可重复任命（旧版可把同一武将派到多城，防御加成叠用）
  const _taken={};Object.keys(S.garrison||{}).forEach(k=>{if(S.garrison[k])_taken[S.garrison[k]]=k;});
  let h='<p>任命 <b>'+n.name+'</b> 守将（防御+30%，AI优先攻无守将城）：</p><p class="muted">⚠ 一将只能守一城：已驻他城者不可再派；改任他城将自动解除原任命。</p><select id="gs_gen"><option value="">（撤防）</option>'
   +gens.map(g=>{const at=_taken[g.id];const dis=!!(at&&at!==id);const atn=at?((S.nodes.find(x=>x.id===at)||{name:'?'}).name):'';
     return '<option value="'+g.id+'" '+((S.garrison[id]===g.id)?'selected':'')+(dis?' disabled':'')+'>'+g.nm+'·统'+g.six.统率+(at?('（已驻'+atn+'）'):'')+'</option>';}).join('')
   +'</select><button class="btn gold" onclick="doGarrison(\''+id+'\')">确认</button>';

function doGarrison(id){const gid=document.getElementById('gs_gen').value;

    let moved=null;Object.keys(S.garrison||{}).forEach(k=>{if(S.garrison[k]===gid&&k!==id){delete S.garrison[k];moved=(S.nodes.find(x=>x.id===k)||{name:'?'}).name;}});
    S.garrison[id]=gid;toast(moved?('已改任（自动解除 '+moved+' 任命）'):'已任命守将，防御+30%');
  }else{S.garrison[id]=null;toast('已撤防');}
