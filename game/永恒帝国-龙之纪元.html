function openBatchRecruit(){  let h='<p>批量征兵（每城征相同数量，单兵约35两，消耗1行动点，每载入限1次）：</p><p>每城征兵：<input id="br_amt" type="number" value="2000" style="width:120px"></p><div class="muted" id="br_info"></div><button class="btn gold" onclick="doBatchRecruit()">确认征兵</button>';showModal('批量征兵',h);setTimeout(()=>{const el=document.getElementById('br_info');if(el){const c=S.nodes.filter(n=>n.owner==='me').length;el.textContent='己方城池 '+c+' 座｜示例：每城2000兵，'+c+'城共约 '+Math.round(2000*c*0.0035)+' 万两';}},30);}
function doBatchRecruit(){if(used('batchrec')){toast('本载入已批量征兵');return;}const amt=Math.max(0,Math.floor(Number(document.getElementById('br_amt').value)||0));const cities=S.nodes.filter(n=>n.owner==='me');const total=amt*cities.length;const k=Math.round(total*0.0035); // 第十三轮：征兵改为真实扣款后，单价 0.0065→0.0035 万两/兵（单兵35两）——按"征兵免费"校准的第12轮经济参数需补偿，否则结构性赤字if(total<=0){toast('请输入数量');return;}if(!beginAct('batchrec',k))return;
  S.gold-=k; // 第十三轮修复：征兵必须真正扣国库（旧版只调 beginAct 校验、未执行扣款，导致"钱够就能征、征完钱还在"）
  // 注意：批量征兵只补充各城池驻军（沙盘可见），全国兵力 S.armies.me 由兵部募兵(actRecruit)增加——
  // 若在此同步累加 S.armies.me，会与城池驻军重复计算，使 powerScore 虚高并误触发"国力过强→外患加剧"的动态难度惩罚。
  const _fneed=Math.round(total*0.008);S.food=Math.max(0,safe(S.food,0)-_fneed); // 新军就食：支粮
  cities.forEach(n=>{n.troop+=amt;});report('批量征兵',[['城池',cities.length],['每城','+'+amt],['总驻军','+'+fmt(total)],['粮','-'+_fneed],['国库(万两)',-k]]);
  log('🪖 批量征兵 '+fmt(total)+' 人，耗银 '+k+' 万两、粮 '+_fneed+' 万石。');closeModal();renderAll();}  // 平衡性优化：征兵单价 0.008→0.0065万两/兵（-18.75%，落于15~20%区间），缓解军事路线经济压力

const DE_PVP = {
  ws: null,
  playerId: null,
  currentRoom: null,
  isReady: false,
  // 默认优先使用在线服务器（异地好友可直接对战）
  serverUrl: 'wss://eternal-empire-pvp-production.up.railway.app',
  // 服务器预设
  SERVER_PRESETS: {
    online: { label: '在线服务器(异地)', url: 'wss://eternal-empire-pvp-production.up.railway.app' },
    local: { label: '本地服务器(同机)', url: 'ws://localhost:3000' },
    lan: { label: '局域网服务器', url: 'ws://localhost:3000' }
  },

  init(options) {
    this.serverUrl = options.serverUrl || 'wss://eternal-empire-pvp-production.up.railway.app';
    console.log('PvP 系统初始化，服务器:', this.serverUrl);
  },

  // 快速选择服务器预设
  setPreset(key) {
    const preset = this.SERVER_PRESETS[key];
    if (!preset) return;
    this.serverUrl = preset.url;
    const input = document.getElementById('pvp_server_url');
    if (input) input.value = preset.url;
    // 如果已经连接，断开并重新连接
    if (this.ws) {
      try { this.ws.close(); } catch(e) {}
      this.ws = null;
    }
    this.connect();
  },

  connect() {
    const input = document.getElementById('pvp_server_url');
    if (input && input.value.trim()) {
      this.serverUrl = input.value.trim();
    }
    if (!this.serverUrl) {
      alert('请先设置服务器地址');
      return;
    }
    this.showNotification('正在连接 ' + this.serverUrl + ' ...', 'info');
    try {
      this.ws = new WebSocket(this.serverUrl);
    } catch (e) {
      console.error('WebSocket 创建失败:', e);
      this.showNotification('连接失败: ' + e.message, 'error');
      return;
    }

    this.ws.onopen = () => {
      console.log('PvP 已连接');
      this.showNotification('已连接到对战服务器', 'success');
      // 连接成功后自动刷新面板，显示"创建房间"等按钮
      if (document.getElementById('modal').classList.contains('show')) {
        this.renderPanel();
      }
    };

    this.ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        this.handleMessage(msg);
      } catch (e) {
        console.error('消息解析失败:', e);
      }
    };

    this.ws.onerror = (err) => {
      console.error('WebSocket 错误:', err);
      this.showNotification('连接错误，请检查服务器地址或网络', 'error');
    };

    this.ws.onclose = (event) => {
      console.log('PvP 连接断开', event.code, event.reason);
      const wasOpen = this.ws && this.ws.readyState === WebSocket.OPEN;
      this.showNotification('服务器已断开 (代码:' + event.code + ')', 'error');
      // 如果面板还打开，3秒后自动重连一次
      if (document.getElementById('modal').classList.contains('show') && !this._reconnecting) {
        this._reconnecting = true;
        setTimeout(() => {
          this._reconnecting = false;
          if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
            this.showNotification('正在尝试自动重连...', 'info');
            this.connect();
          }
        }, 3000);
      }
    };
  },

  handleMessage(msg) {
    switch (msg.type) {
      case 'connected':
        this.playerId = msg.playerId;
        break;

      case 'room_created':
        this.currentRoom = msg.roomId;
        this.showNotification('房间创建成功: ' + msg.roomId, 'success');
        break;

      case 'joined':
        this.showNotification(msg.message, 'success');
        break;

      case 'ready_changed':
        this.isReady = msg.ready;
        this.updateReadyButton();
        break;

      case 'game_start':
        this.showNotification('游戏开始！' + msg.message, 'success');
        this.startTimer(msg.timeout);
        break;

      case 'action_result':
        this.showNotification('行动成功，当前得分: ' + msg.score, 'info');
        break;

      case 'surrendered':
        this.showNotification('你已认输', 'error');
        break;

      case 'game_end':
        this.showNotification(msg.message, msg.isWinner ? 'success' : 'error');
        break;

      case 'error':
        this.showNotification('错误: ' + msg.message, 'error');
        break;
    }
  },

  startTimer(timeout) {
    const timerEl = document.getElementById('pvp_timer');
    if (!timerEl) return;

    let remaining = Math.ceil(timeout / 1000);
    timerEl.textContent = remaining + '秒';

    const interval = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        clearInterval(interval);
        timerEl.textContent = '时间到！';
      } else {
        timerEl.textContent = remaining + '秒';
      }
    }, 1000);
  },

  createRoom() {
    if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
      this.showNotification('请先连接到服务器', 'error');
      return;
    }
    const roomId = prompt('请输入房间ID（留空自动生成）：', 'DE-' + Date.now().toString(36).toUpperCase());
    if (!roomId) return;

    this.ws.send(JSON.stringify({
      type: 'create_room',
      roomId: roomId,
      roomName: '永恒帝国对战房',
      timeout: 30000
    }));
  },

  joinRoom() {
    if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
      this.showNotification('请先连接到服务器', 'error');
      return;
    }
    const roomId = prompt('请输入房间ID：');
    if (!roomId) return;

    this.ws.send(JSON.stringify({ type: 'join_room', roomId: roomId }));
  },

  toggleReady() {
    if (!this.ws || this.ws.readyState !== WebSocket.OPEN) return;
    this.ws.send(JSON.stringify({ type: 'ready' }));
  },

  doAction(action) {
    if (!this.ws || this.ws.readyState !== WebSocket.OPEN) return;
    this.ws.send(JSON.stringify({ type: 'action', action: action }));
  },

  surrender() {
    if (!confirm('确定要认输吗？')) return;
    if (!this.ws || this.ws.readyState !== WebSocket.OPEN) return;
    this.ws.send(JSON.stringify({ type: 'surrender' }));
  },

  showPanel() {
    // 如果已连接则直接显示面板
    if (this.ws && this.ws.readyState === WebSocket.OPEN) {
      this.renderPanel();
      return;
    }

    let h = '<div class="card3" style="margin-top:10px">';
    h += '<p class="h">⚔ 实时对战</p>';
    h += '<div class="muted" style="line-height:1.8">';
    h += '与好友进行 <b>30秒限时竞技</b>，比拼谁先占领更多城池！<br>';

    // 服务器预设选择
    h += '<div class="row" style="margin-top:15px; gap:8px; flex-wrap:wrap">';
    h += '<select id="pvp_server_preset" onchange="DE_PVP.setPreset(this.value)" style="padding:8px; border-radius:6px; border:1px solid var(--border); background:var(--bg2); color:var(--text);">';
    h += '<option value="online">🌐 在线服务器（异地好友）</option>';
    h += '<option value="local">🏠 本地服务器（自己电脑）</option>';
    h += '<option value="lan">📡 局域网服务器（同WiFi）</option>';
    h += '</select>';

    // 添加服务器地址输入框
    h += '<div class="row" style="margin-top:10px; gap:8px">';
    h += '<input type="text" id="pvp_server_url" placeholder="输入服务器地址" value="' + this.serverUrl + '" style="flex:1; padding:8px; border-radius:6px; border:1px solid var(--border); background:var(--bg2); color:var(--text);">';
    h += '<button class="btn" onclick="DE_PVP.connect()">连接</button>';
    h += '</div>';

    h += '<div id="pvp_status" class="muted" style="margin-top:8px">等待连接...</div>';

    // 分享按钮始终显示（无需连接）
    h += '<div class="row" style="gap:8px;margin-top:12px; align-items:flex-start">';
    h += '<button class="btn gold sm" onclick="DE_PVP.shareGame()">📤 分享游戏</button>';
    h += '<span class="muted" style="font-size:12px">把链接发给好友，对方打开并输入相同种子 = 同图竞速</span>';
    h += '</div>';

    h += '</div>';

    showModal('⚔ 实时对战', h);
    // 根据当前 serverUrl 设置下拉框
    this._syncPresetSelect();
  },

  _syncPresetSelect() {
    const select = document.getElementById('pvp_server_preset');
    if (!select) return;
    const found = Object.entries(this.SERVER_PRESETS).find(([k, v]) => v.url === this.serverUrl);
    if (found) {
      select.value = found[0];
    } else {
      select.value = '';
    }
  },

  renderPanel() {
    const roomId = this.currentRoom || '(未加入房间)';
    const playerState = this.playerId ? '玩家ID: ' + this.playerId.slice(0, 8) + '...' : '未认证';
    const readyState = this.isReady ? '已准备 ✓' : '未准备';
    const roomBtn = this.currentRoom
      ? '<button class="btn sm" onclick="DE_PVP.surrender()">认输</button>'
      : '<button class="btn gold sm" onclick="DE_PVP.createRoom()">创建房间</button>'
      + '<button class="btn sm" onclick="DE_PVP.joinRoom()">加入房间</button>';
    const serverLabel = this.serverUrl.includes('railway')
      ? '🌐 在线服务器'
      : (this.serverUrl.includes('localhost') ? '🏠 本地服务器' : '📡 自定义服务器');

    let h = '<div class="card3" style="margin-top:10px">';
    h += '<p class="h">⚔ 实时对战</p>';
    h += '<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-bottom:12px">';
    h += '<span class="muted">服务器: <b style="color:var(--gold2)">' + serverLabel + '</b></span>';
    h += '<span class="muted">地址: <b style="color:var(--gold2);font-size:11px">' + this.serverUrl + '</b></span>';
    h += '<span class="muted">状态: <b style="color:var(--good)">已连接</b></span>';
    h += '<span class="muted">房间: <b>' + roomId + '</b></span>';
    h += '<span class="muted">准备: <b id="pvp_ready_btn">' + readyState + '</b></span>';
    h += '</div>';

    h += '<div class="row" style="gap:8px;margin-bottom:12px; flex-wrap:wrap">';
    h += roomBtn;
    h += '<button class="btn sm" onclick="DE_PVP.toggleReady()">准备/取消</button>';
    h += '<button class="btn sm" onclick="DE_PVP.showPanel()">刷新</button>';
    h += '<button class="btn sm" onclick="DE_PVP.disconnect()">断开</button>';
    h += '</div>';

    // 游戏分享按钮
    h += '<div class="row" style="gap:8px;margin-bottom:8px; align-items:flex-start">';
    h += '<button class="btn gold sm" onclick="DE_PVP.shareGame()">📤 分享游戏</button>';
    h += '<span class="muted" style="font-size:12px">把链接发给好友，对方打开并输入相同种子 = 同图竞速</span>';
    h += '</div>';

    h += '<div id="pvp_status" class="muted" style="margin-top:8px">就绪</div>';
    h += '</div>';

    showModal('⚔ 实时对战', h);
  },

  disconnect() {
    if (this.ws) {
      try { this.ws.close(); } catch(e) {}
      this.ws = null;
    }
    this.playerId = null;
    this.currentRoom = null;
    this.isReady = false;
    this.showNotification('已断开连接', 'info');
    this.showPanel();
  },

  // 分享游戏链接给好友
  shareGame() {
    const seed = S && S.seed ? S.seed : seasonSeed();
    // 使用GitHub Pages作为在线游戏地址（好友可直接打开）
    const gameUrl = 'https://pika702.github.io/eternal-empire-pvp/';
    // 当前使用的服务器地址
    const serverUrl = this.serverUrl || 'wss://eternal-empire-pvp-production.up.railway.app';
    const isOnline = serverUrl.includes('railway');

    let shareText = '🎮 永恒帝国 · 龙之纪元\n\n';
    shareText += '🌾 赛季种子: ' + seed + '\n\n';
    shareText += '👉 玩法：点开链接开局，在游戏设置里输入相同种子，即可同图竞速！\n';
    if (isOnline) {
      shareText += '⚔️ 想对战？进入「设置→实时对战」，点连接即可自动匹配在线服务器。\n';
    } else {
      shareText += '⚔️ 想对战？房主先启动本地服务器，好友进入「设置→实时对战」连接同一服务器。\n';
    }
    shareText += '\n' + gameUrl;

    // 复制到剪贴板
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(shareText).then(() => {
        toast('📤 分享文本已复制，发给好友吧！');
      }).catch(() => {
        this.fallbackCopy(shareText);
      });
    } else {
      this.fallbackCopy(shareText);
    }
  },

  fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      toast('📤 分享文本已复制，发给好友吧！');
    } catch(e) {
      prompt('请复制以下分享文本发给好友：', text);
    }
    document.body.removeChild(ta);
  },

  updateReadyButton() {
    const btn = document.getElementById('pvp_ready_btn');
    if (btn) {
      btn.textContent = this.isReady ? '已准备 ✓' : '准备';
      btn.classList.toggle('ready', this.isReady);
    }
  },

  showNotification(msg, type) {
    toast(msg, type);
    const status = document.getElementById('pvp_status');
    if (status) {
      status.textContent = msg;
      status.style.color = type === 'success' ? 'var(--good)' : (type === 'error' ? 'var(--bad)' : 'var(--muted)');
    }
  }
};
</script>
</body>
</html>
